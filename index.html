const OPEN=[
 {id:"o_h1",t:3,ex:1,q:"Aufgabe 1: Beschreiben Sie den anatomischen Aufbau des Herzens (Lage, Herzhöhlen, Aufgaben, Septum, linke Kammer).",
  pts:["Lage im Mediastinum zwischen den Lungenflügeln, auf dem Zwerchfell; Spitze links unten","Rechter/linker Vorhof, rechte/linke Kammer","Rechter Vorhof sammelt Blut aus den Hohlvenen, rechte Kammer pumpt in den Lungenkreislauf","Linker Vorhof nimmt Blut aus den Lungenvenen auf, linke Kammer pumpt in die Aorta","Septum trennt rechte und linke Herzhälfte (O2-armes und O2-reiches Blut)","Linke Kammer muskulöser – pumpt gegen den hohen Druck des Körperkreislaufs"],
  a:"Das Herz ist ein muskuläres Hohlorgan im Mediastinum, die Spitze zeigt nach links unten. Es hat zwei Vorhöfe und zwei Kammern. Der rechte Vorhof sammelt das O2-arme Blut aus den Hohlvenen, die rechte Kammer pumpt es in den Lungenkreislauf. Der linke Vorhof bekommt O2-reiches Blut aus den Lungenvenen, die linke Kammer pumpt es in die Aorta. Das Septum trennt die rechte von der linken Herzhälfte. Die linke Kammer ist muskulöser, weil sie gegen den höheren Druck des Körperkreislaufs pumpen muss."},
 {id:"o_h2",t:3,ex:1,q:"Aufgabe 2: Erklären Sie die Funktion der vier Herzklappen (Namen, Lage, Segel- vs. Taschenklappen, Stenose, Insuffizienz).",
  pts:["Trikuspidalklappe: re. Vorhof – re. Kammer (3 Zipfel)","Mitralklappe: li. Vorhof – li. Kammer (2 Zipfel)","Pulmonalklappe: re. Kammer – Truncus pulmonalis; Aortenklappe: li. Kammer – Aorta","Segelklappen (AV) mit Sehnenfäden + Papillarmuskeln zwischen Vorhof und Kammer","Taschenklappen: 3 Taschen, „Mercedesstern“, zwischen Kammer und Arterie","Klappen = Ventile, gerichteter Blutfluss","Stenose = Verengung; Insuffizienz = unvollständiger Schluss → Herzgeräusche"],
  a:"Es gibt zwei Segelklappen und zwei Taschenklappen. Die Trikuspidalklappe liegt zwischen rechtem Vorhof und rechter Kammer, die Mitralklappe zwischen linkem Vorhof und linker Kammer. Die Segelklappen sind über Sehnenfäden an Papillarmuskeln befestigt. Die Pulmonalklappe liegt zwischen rechter Kammer und Truncus pulmonalis, die Aortenklappe zwischen linker Kammer und Aorta – das sind Taschenklappen aus drei Taschen. Die Klappen sorgen dafür, dass das Blut nur in eine Richtung fließt. Bei einer Stenose ist die Klappe verengt, bei einer Insuffizienz schließt sie nicht vollständig; beides erzeugt Herzgeräusche."},
 {id:"o_h3",t:3,ex:1,q:"Aufgabe 3: Beschreiben Sie die Schichten der Herzwand und den Herzbeutel.",
  pts:["Endokard: glatte Innenschicht, aus ihm entspringen die Klappen","Myokard: kräftige Muskelschicht, Glanzstreifen (Gap Junctions)","Epikard: Außenschicht = inneres Blatt des Herzbeutels","Perikard: äußeres Blatt, unten mit dem Zwerchfell verwachsen","Perikardhöhle mit wenig Flüssigkeit → Reibung ↓","Myokard ermöglicht Pumpfunktion; Erregung breitet sich über das ganze Myokard aus"],
  a:"Die Herzwand hat drei Schichten. Innen liegt das Endokard, eine glatte Schicht, aus der auch die Klappen entstehen. In der Mitte liegt das Myokard, der kräftige Herzmuskel; die Zellen sind über Glanzstreifen verbunden, deshalb breitet sich die Erregung über das ganze Herz aus und es kann pumpen. Außen liegt das Epikard; es ist gleichzeitig das innere Blatt des Herzbeutels. Der Herzbeutel bildet eine Höhle mit etwas Flüssigkeit und verringert die Reibung."},
 {id:"o_h4",t:3,ex:1,q:"Aufgabe 4: Wie wird der Herzmuskel selbst mit Blut versorgt? Was passiert beim Verschluss?",
  pts:["Rechte und linke Herzkranzarterie (A. coronaria dextra / sinistra)","Ursprung am Anfang der Aorta direkt nach der Aortenklappe","Durchblutung hauptsächlich in der Diastole","Verschluss → Sauerstoffmangel → Herzmuskelzellen sterben ab = Herzinfarkt","LCA/LAD → Vorderwandinfarkt","RCA oder Ramus circumflexus → Hinterwandinfarkt"],
  a:"Der Herzmuskel wird über die Herzkranzarterien versorgt: die rechte und die linke Koronararterie. Sie entspringen direkt nach der Aortenklappe aus der Aorta. Sie füllen sich vor allem in der Diastole, weil der Muskel in der Systole die Gefäße zusammendrückt. Wird ein Gefäß verschlossen, bekommt der Muskel keinen Sauerstoff und Zellen sterben ab – das ist ein Herzinfarkt. Bei einem Verschluss der linken Arterie bzw. LAD entsteht ein Vorderwandinfarkt, bei der rechten Arterie oder dem Ramus circumflexus ein Hinterwandinfarkt."},
 {id:"o_h5",t:3,ex:1,q:"Aufgabe 5: Erklären Sie den Herzzyklus (Systole, Diastole, Klappen, Herztöne).",
  pts:["Systole: Anspannung + Austreibung aus den Kammern","Systole: Segelklappen zu, Taschenklappen offen (Austreibung)","Diastole: Entspannung + Füllung der Kammern","Diastole: Taschenklappen zu, Segelklappen offen (Füllung)","1. Herzton: Anspannung der Kammermuskulatur (AV-Klappenschluss)","2. Herzton: Schluss der Taschenklappen"],
  a:"Der Herzzyklus hat zwei Phasen. In der Systole spannen sich die Kammern an und werfen das Blut aus; die Segelklappen sind geschlossen, die Taschenklappen öffnen sich. In der Diastole entspannen sich die Kammern und füllen sich; die Taschenklappen sind geschlossen, die Segelklappen offen. Der erste Herzton entsteht durch die Anspannung der Kammermuskulatur zu Beginn der Systole, der zweite durch den Schluss der Taschenklappen."},
 {id:"o_h6",t:3,ex:1,q:"Aufgabe 6: Beschreiben Sie das Erregungsbildungs- und Erregungsleitungssystem.",
  pts:["Spezialisierte Herzmuskelzellen, keine Nervenzellen; Herz ist autonom","Sinusknoten = primärer Schrittmacher (60–80/min)","AV-Knoten verzögert die Überleitung (Ersatz 30–50/min)","His-Bündel (ca. 20/min) → Tawara-Schenkel → Purkinje-Fasern","Koordinierte Erregung → geordnete Kontraktion Vorhöfe vor Kammern","Vegetatives Nervensystem moduliert nur"],
  a:"Das Herz bildet seine Erregung selbst, in spezialisierten Herzmuskelzellen. Der Sinusknoten ist der Schrittmacher mit 60–80 Schlägen pro Minute. Die Erregung läuft über die Vorhöfe zum AV-Knoten, der die Überleitung verzögert, damit sich die Kammern füllen können. Dann geht sie über das His-Bündel, die Tawara-Schenkel und die Purkinje-Fasern in die Kammermuskulatur. Nur wenn die Erregung koordiniert ist, ziehen sich erst die Vorhöfe und dann die Kammern geordnet zusammen."},
 {id:"o_h7",t:3,ex:1,q:"Aufgabe 7: Erklären Sie die Bedeutung des EKG (Ruhe-, Belastungs-, 24-h-EKG, 12-Kanal, Elektroden).",
  pts:["Misst die elektrische Aktivität über Hautelektroden als Kurve","Aussage über Herzlage, Frequenz, Rhythmus, Erregungsursprung, -ausbreitung, -rückbildung, Elektrolyte, Medikamente","Kaum Aussage über die Pumpleistung","12-Kanal-EKG = Standardableitungen (Extremitäten + Brustwand)","Ruhe-EKG im Liegen; Belastungs-EKG unter Belastung; 24-h-EKG über einen Tag","Korrekte Elektrodenposition für aussagekräftige Ableitung"],
  a:"Mit dem EKG zeichnet man die elektrische Aktivität des Herzens über Elektroden auf der Haut auf. Man sieht Frequenz, Rhythmus, Erregungsursprung, -ausbreitung und -rückbildung, außerdem Hinweise auf Herzinfarkt, Elektrolytstörungen oder Medikamente. Über die Pumpleistung sagt das EKG kaum etwas aus. Das 12-Kanal-EKG ist die Standardableitung. Das Ruhe-EKG wird im Liegen gemacht, das Belastungs-EKG unter körperlicher Belastung und das 24-Stunden-EKG über einen ganzen Tag. Die Elektroden müssen richtig liegen, sonst ist die Kurve verfälscht."},
 {id:"o_h8",t:3,ex:1,q:"Aufgabe 8: Vergleichen Sie Vorhofflattern, Vorhofflimmern, SVT, ventrikuläre Tachykardie und Kammerflimmern.",
  pts:["Vorhofflattern: kreisender Impuls 200–300/min im re. Vorhof, nur jede 2.–3. Erregung übergeleitet","Vorhofflimmern: chaotisch > 300/min, Herzleistung ↓, Schlaganfallrisiko","SVT: Ursprung oberhalb der Kammern, Herzrasen, Schwindel","Ventrikuläre Tachykardie/Kammerflattern > 300/min: zu wenig Füllung, Notfall","Kammerflimmern > 400/min: kein Auswurf, Bewusstlosigkeit, Herztod","Therapie Kammer: Defibrillation, Reanimation"],
  a:"Vorhofflattern und Vorhofflimmern entstehen in den Vorhöfen. Beim Flattern kreist ein Impuls mit 200–300 pro Minute, nur jede zweite bis dritte Erregung geht auf die Kammer. Beim Flimmern sind die Impulse chaotisch, über 300 pro Minute; beide erhöhen das Schlaganfallrisiko. Die SVT entsteht oberhalb der Kammern, das Herz schlägt sehr schnell. Die ventrikuläre Tachykardie entsteht in den Kammern; das Herz kann sich nicht mehr füllen – ein Notfall. Beim Kammerflimmern über 400 pro Minute wird gar kein Blut mehr ausgeworfen, der Patient wird sofort bewusstlos; deshalb sofort defibrillieren und reanimieren."},
 {id:"o_h9",t:3,ex:1,q:"Aufgabe 9: Wie reguliert das Herz seine Pumpleistung? (HF, SV, HZV, Vorlast, Nachlast, Frank-Starling) + HZV bei SV 80 ml, HF 75/min.",
  pts:["HF = Schläge pro Minute; SV ≈ 70 ml pro Schlag","HZV = SV × HF ≈ 5 l/min","Vorlast = Füllung/Dehnung durch venösen Rückstrom","Nachlast = Widerstand, gegen den das Herz pumpt","Frank-Starling: mehr Füllung → mehr Vordehnung → stärkere Kontraktion","Rechnung: 80 ml × 75/min = 6000 ml = 6 l/min","Sympathikus steigert HF und Kraft"],
  a:"Die Herzfrequenz ist die Zahl der Schläge pro Minute, das Schlagvolumen die Blutmenge pro Schlag, in Ruhe etwa 70 ml. Das Herzzeitvolumen ist Schlagvolumen mal Herzfrequenz, etwa 5 Liter pro Minute. Die Vorlast ist die Füllung der Kammer, die Nachlast der Widerstand, gegen den das Herz pumpt. Nach dem Frank-Starling-Mechanismus wird der Muskel bei stärkerer Füllung mehr gedehnt und zieht sich kräftiger zusammen. Bei 80 ml mal 75 Schlägen ergibt sich ein HZV von 6 Litern pro Minute."},
 {id:"o_zm",t:1,q:"Beschreiben Sie den Aufbau der Zellmembran und welche Stoffe sie passieren können.",
  pts:["Lipiddoppelschicht mit eingelagerten Membranproteinen","Glykokalix: Rezeptor, Schutz, Zell-Zell-Kontakte","semipermeabel (selektiv durchlässig)","frei: lipophile Stoffe, Gase, Alkohol, Steroidhormone","Ionen und Wasser brauchen Kanäle","Na+ außen hoch, K+ innen hoch → Ruhemembranpotential (Na+-K+-ATPase)"],
  a:"Die Zellmembran ist eine Lipiddoppelschicht mit Proteinen. Außen liegt die Glykokalix für Rezeptoren, Schutz und Zellkontakte. Die Membran ist semipermeabel: Fettlösliche Stoffe, Gase, Alkohol und Steroidhormone gehen frei durch, Wasser und Ionen brauchen Kanäle. Außen ist viel Natrium, innen viel Kalium; die Natrium-Kalium-Pumpe hält so das Ruhemembranpotential aufrecht."},
 {id:"o_osm",t:1,q:"Erklären Sie Diffusion, Osmose, onkotischen Druck und iso-/hypo-/hyperton.",
  pts:["Diffusion: Teilchen von hoher zu niedriger Konzentration, passiv","Osmose: Lösungsmittel durch semipermeable Membran","onkotischer Druck durch Proteine (Albumin)","isoton = gleich (NaCl 0,9 %)","hypoton → Zelle schwillt/platzt","hyperton → Zelle schrumpft"],
  a:"Bei der Diffusion wandern Teilchen von der hohen zur niedrigen Konzentration. Bei der Osmose wandert das Wasser durch eine halbdurchlässige Membran. Der onkotische Druck ist der Teil des osmotischen Drucks, den große Proteine wie Albumin erzeugen. In isotoner Lösung bleibt die Zelle gleich, in hypotoner schwillt sie an und platzt, in hypertoner schrumpft sie."},
 {id:"o_epi",t:2,q:"Nennen Sie die 4 Grundgewebe mit Aufgaben und je ein Beispiel.",
  pts:["Epithel: Schutz, Sekretion, Resorption, Reizaufnahme (Haut, Drüsen)","Binde-/Stützgewebe: mechanisch, Stoffwechsel, Abwehr (Sehne, Knorpel, Knochen, Fett)","Muskel: Kontraktion, Bewegung (Skelett, Herz, glatt)","Nerv: Reizaufnahme, -verarbeitung, -weiterleitung (Neuron + Glia)"],
  a:"Es gibt vier Grundgewebe. Epithelgewebe bedeckt Oberflächen und bildet Drüsen – Schutz, Sekretion, Resorption. Binde- und Stützgewebe gibt mechanischen Halt, z. B. Sehnen, Knorpel, Knochen und Fett. Muskelgewebe ermöglicht Bewegung: Skelettmuskel, Herzmuskel und glatte Muskulatur. Nervengewebe nimmt Reize auf, verarbeitet und leitet sie weiter."},
 {id:"o_ven",t:4,q:"Welche Mechanismen fördern den venösen Rückstrom? Was ist eine venöse Insuffizienz?",
  pts:["Venenklappen als Einwegventile","Muskelpumpe (tiefe Beinvenen im Faszienschlauch)","Pulswelle der benachbarten Arterie","Sogwirkung des Herzens (Ventilebene)","Atmung: intrathorakaler Druck sinkt bei Einatmung","Insuffizienz: Klappen schließen nicht → Rückfluss, Blut versackt im Stehen"],
  a:"Den Rückstrom zum Herzen fördern die Venenklappen, die Muskelpumpe beim Gehen, die Pulswelle der Arterien daneben, die Sogwirkung des Herzens und die Atmung. Bei einer venösen Insuffizienz schließen die Klappen nicht mehr richtig, das Blut fließt zurück und staut sich in den Beinen."},
 {id:"o_kap",t:4,q:"Wie funktioniert der Stoffaustausch in der Kapillare?",
  pts:["Wand: Endothel, Basalmembran, Perizyten","fettlösliche Stoffe durch die Membran, wasserlösliche durch Endothellücken","hydrostatischer Druck presst Flüssigkeit hinaus (arteriell höher)","onkotischer Druck (Albumin) zieht zurück (venös überwiegt)","90 % zurück in Venen, 10 % über Lymphe"],
  a:"Die Kapillarwand ist sehr dünn. Fettlösliche Stoffe wie O2 und CO2 diffundieren direkt, wasserlösliche durch Lücken im Endothel. Am arteriellen Ende überwiegt der hydrostatische Druck und presst Flüssigkeit ins Gewebe, am venösen Ende überwiegt der onkotische Druck der Proteine und holt sie zurück. Etwa 90 % kommen zurück in die Venen, 10 % gehen in die Lymphe."},
 {id:"o_hb",t:5,q:"Beschreiben Sie Blutstillung und Blutgerinnung.",
  pts:["primär: Vasokonstriktion","Thrombozytenadhäsion und -aggregation → weißer Thrombus","sekundär: Gerinnungskaskade (13 Faktoren) → Thrombin","Fibrinogen → Fibrin, Netz → roter Thrombus","Retraktion","Fibrinolyse durch Plasmin; Vitamin K für Gerinnungsfaktoren"],
  a:"Bei einer Verletzung zieht sich das Gefäß zusammen. Thrombozyten lagern sich an, werden aktiviert und bilden einen weißen Thrombus – das ist die primäre Hämostase. Gleichzeitig startet die Gerinnungskaskade, an deren Ende Thrombin steht. Thrombin wandelt Fibrinogen in Fibrin um; das Fibrinnetz fängt Erythrozyten ein, es entsteht der rote Thrombus. Danach ziehen sich die Fasern zusammen. Später löst Plasmin das Netz wieder auf."},
 {id:"o_rh",t:5,q:"Erklären Sie das ABO- und Rhesus-System und die Rhesusprophylaxe.",
  pts:["Antigene auf Erythrozyten; Antikörper gegen fehlendes Antigen in den ersten Lebenswochen (ABO)","Falsche Transfusion → Agglutination","0 = Universalspender Ery; AB = Universalempfänger Ery","Rh+ = Antigen D (85 %), Antikörper erst nach Fremdblutkontakt","Rh-Antikörper plazentagängig, ABO nicht","Rh− Mutter + Rh+ Kind → Anti-D-Prophylaxe in SS und nach Geburt"],
  a:"Beim ABO-System tragen die Erythrozyten Antigene A und/oder B; gegen das fehlende Antigen bildet man schon als Säugling Antikörper. Eine falsche Transfusion führt zur Verklumpung. Null ist Universalspender für Erythrozyten. Beim Rhesus-System bilden sich Antikörper erst nach Kontakt mit Rh-positivem Blut, und sie gehen durch die Plazenta. Ist die Mutter Rh-negativ und das Kind Rh-positiv, bekommt sie Anti-D, damit ein zweites Kind geschützt ist."},
 {id:"o_lymph",t:6,q:"Beschreiben Sie den Lymphabfluss und die Aufgaben von Lymphknoten und Milz.",
  pts:["Lymphkapillaren nehmen 10 % der filtrierten Flüssigkeit auf","untere Körperhälfte + Darm → Cisterna chyli → Ductus thoracicus → linker Venenwinkel","linke Kopf-/Halsseite → links; rechter Arm + rechte Kopf-/Halsseite → rechter Venenwinkel","Lymphknoten filtern Lymphe, B-Zellen kortikal, T-Zellen parakortikal","Milz: links unter Zwerchfell, kontrolliert das Blut, rote Pulpa baut Erythrozyten ab"],
  a:"Etwa 10 % der Gewebeflüssigkeit fließen als Lymphe ab. Aus der unteren Körperhälfte und dem Darm sammelt sie sich in der Cisterna chyli und läuft über den Ductus thoracicus in den linken Venenwinkel. Rechter Arm und rechte Kopf-Hals-Seite münden rechts. Lymphknoten filtern die Lymphe, die Milz kontrolliert das Blut und baut in der roten Pulpa alte Erythrozyten ab."},
 {id:"o_atm",t:7,q:"Erklären Sie Ein- und Ausatmung, Totraum und alveoläre Ventilation.",
  pts:["Einatmung aktiv: Zwerchfell kontrahiert, äußere Zwischenrippenmuskeln heben Brustkorb","Lunge folgt passiv (Pleura-Unterdruck)","Ausatmung passiv durch Elastizität","Totraum ca. 150 ml (Nase bis Bronchiolen)","alveoläre Ventilation = 500 − 150 = 350 ml","tief und langsam atmen ist effektiver"],
  a:"Bei der Einatmung zieht sich das Zwerchfell zusammen und senkt sich, die äußeren Zwischenrippenmuskeln heben den Brustkorb; die Lunge folgt passiv. Die Ausatmung ist passiv durch die Elastizität der Lunge. Etwa 150 ml Luft bleiben im Totraum und nehmen nicht am Gasaustausch teil. Bei 500 ml Atemzug kommen nur 350 ml in die Alveolen. Deshalb ist tiefes, langsames Atmen besser als flaches, schnelles."},
 {id:"o_nier",t:8,q:"Wie entsteht der Harn in der Niere?",
  pts:["Nephron = Nierenkörperchen (Glomerulus + Bowman-Kapsel) + Tubulus","Filtration: ca. 180 l Primärharn/Tag, eiweißfrei","Resorption: 99 % zurück, Glukose/Aminosäuren vollständig","Sekretion von Stoffen in den Harn","ADH und Aldosteron steigern Rückresorption","ca. 1,5 l Endharn (Harnstoff, Harnsäure, Kreatinin)"],
  a:"Im Glomerulus wird aus dem Blut Primärharn filtriert, etwa 180 Liter pro Tag, normalerweise ohne Eiweiß. Im Tubulussystem werden 99 % wieder resorbiert, Glukose und Aminosäuren vollständig. Andere Stoffe werden sezerniert. ADH und Aldosteron steigern die Rückresorption von Wasser und Natrium. Am Ende bleiben etwa 1,5 Liter Endharn mit Harnstoff, Harnsäure und Kreatinin."},
 {id:"o_ph",t:8,q:"Wie wird der pH-Wert des Blutes reguliert? Was sind Azidose und Alkalose?",
  pts:["pH 7,4 (7,37–7,45), wichtig für Enzyme","Bicarbonat-Puffer = wichtigstes Puffersystem","Lunge atmet CO2 ab (schnell)","Niere: HCO3−-Rückresorption, H+-Ausscheidung (Stunden)","Azidose < 7,37; Alkalose > 7,45","respiratorisch (Atmung, z. B. Hyperventilation) vs. metabolisch (Diabetes, Erbrechen)"],
  a:"Der Blut-pH liegt bei 7,4, zwischen 7,37 und 7,45. Das wichtigste Puffersystem ist der Bicarbonatpuffer. Die Lunge reguliert schnell über die Abatmung von CO2, die Niere langsamer über Bicarbonat und die Ausscheidung von H+. Unter 7,37 spricht man von Azidose, über 7,45 von Alkalose. Respiratorische Störungen kommen von der Atmung, metabolische vom Stoffwechsel."}

function mtDrag(c){
  const k=+c.dataset.k; let sx,sy,g=null,over=null;
  c.addEventListener("pointerdown",e=>{ if(e.button>0)return; sx=e.clientX;sy=e.clientY; c.setPointerCapture(e.pointerId);
    const mv=ev=>{ if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      if(!g){g=c.cloneNode(true);g.classList.add("ghost");g.style.width=c.offsetWidth+"px";document.body.appendChild(g);c.style.opacity=".3";}
      g.style.left=(ev.clientX-g.offsetWidth/2)+"px";g.style.top=(ev.clientY-g.offsetHeight/2)+"px";
      const z=document.elementFromPoint(ev.clientX,ev.clientY);const zone=z&&z.closest(".mt-bin,.mt-pool");
      if(zone!==over){over&&over.classList.remove("over");over=zone;over&&over.classList.add("over");}
      ev.preventDefault(); };
    const up=()=>{ c.removeEventListener("pointermove",mv);c.removeEventListener("pointerup",up);c.removeEventListener("pointercancel",up);
      if(g){g.remove();g=null; if(over)mtMove(k,+over.dataset.b); else {c.style.opacity="";} }
      else { if(MT.at[k]>=0&&MT.sel===null) mtMove(k,-1); else {MT.sel=MT.sel===k?null:k; mtView();} } };
    c.addEventListener("pointermove",mv);c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
  });
}

function kkToday(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function kkNewLimit(){ return store.get("guk_kknew",30); }
function kkNewDone(){ const x=store.get("guk_kkday",{}); return x.d===kkToday()?x.n:0; }
function kkNewInc(){ store.set("guk_kkday",{d:kkToday(),n:kkNewDone()+1}); }
function kkPool(){ return KARTEN.filter(c=>kkDecks.includes(c.t)); }
function kkCounts(cards){ const now=Date.now(); let neu=0,due=0,learn=0;
  cards.forEach(c=>{const s=KS[c.id]; if(!s)neu++; else if(s.d<=now){ if(s.i<1)learn++; else due++; }}); return {neu,due,learn}; }
/* Planung wie Anki (vereinfacht): Lernschritte 1/6/10 min, dann Tage × Leichtigkeit */
function kkNext(c,g){
  const s=KS[c.id]||{i:0,e:2.5,r:0,l:0,st:0}; let {i,e,r,l,st}=s; let ms;
  if(i<1){
    if(g===0){ ms=MINUTE; st=0; }
    else if(g===1){ ms=6*MINUTE; }
    else if(g===2){ if(st>=1){ i=s.li?Math.max(1,Math.round(s.li*0.5)):1; ms=i*DAY; } else { st=1; ms=10*MINUTE; } }
    else { i=Math.max(4,s.li?Math.round(s.li*0.7):4); ms=i*DAY; e=Math.min(3,e+0.15); }
  } else {
    if(g===0){ l++; e=Math.max(1.3,e-0.2); return {i:0,li:i,e,r:r+1,l,st:1,d:Date.now()+10*MINUTE,ms:10*MINUTE}; }
    if(g===1){ e=Math.max(1.3,e-0.15); i=Math.max(i+1,Math.round(i*1.2)); }
    else if(g===2){ i=Math.max(i+1,Math.round(i*e)); }
    else { e=e+0.15; i=Math.max(i+2,Math.round(i*e*1.3)); }
    ms=i*DAY;
  }
  return {i,li:s.li,e,r:r+1,l,st,d:Date.now()+ms,ms};
}
function kkFmt(ms){ if(ms<DAY){ const m=Math.round(ms/MINUTE); return m<60?(m<1?"<1 min":m+" min"):Math.round(m/60)+" h"; }
  const d=Math.round(ms/DAY); return d<30?d+" T":d<365?(Math.round(d/3)/10).toString().replace(".",",")+" Mo":(Math.round(d/36.5)/10).toString().replace(".",",")+" J"; }
const KK={q:[],cur:null,flip:false,cram:false,done:0};
function karten(){
  hideSide();
  const pool=kkPool(), c=kkCounts(pool), nl=kkNewLimit(), left=Math.max(0,nl-kkNewDone());
  const newToday=Math.min(c.neu,left);
  app.innerHTML=`
  <header class="head"><div class="status">Wiederholung wie in Anki</div><h1><span class="x">Kartei</span>karten</h1>
   <p class="sub">${KARTEN.length} Karten: Fakten, Zahlen und Begriffe aus den Unterlagen. Karte antippen zum Umdrehen, dann ehrlich bewerten – die App plant die nächste Wiederholung.</p></header>
  <section class="panel">
    <div class="kk-sum">
      <div><b class="kk-n">${newToday}</b><span>Neu heute</span></div>
      <div><b class="kk-l">${c.learn}</b><span>Lernen</span></div>
      <div><b class="kk-d">${c.due}</b><span>Fällig</span></div>
    </div>
    <div class="row"><button class="btn" id="kk-go" ${newToday+c.learn+c.due?"":"disabled"}>Lernen starten</button><button class="btn ghost" id="kk-cram">Alle durchblättern</button></div>
    ${newToday+c.learn+c.due?"":`<p class="sub">Für heute ist nichts mehr fällig. „Alle durchblättern“ geht immer – ohne die Planung zu ändern.</p>`}
  </section>
  <section class="panel">
    <div class="qhead"><h2>Stapel</h2><div class="row tight"><button class="chip" id="kk-all">alle</button><button class="chip" id="kk-none">keine</button></div></div>
    <div class="chips">${Object.keys(KDECKS).map(t=>{const n=KARTEN.filter(x=>x.t==t).length, cc=kkCounts(KARTEN.filter(x=>x.t==t));
      return `<button class="chip" data-d="${t}" aria-pressed="${kkDecks.includes(+t)}">${esc(KDECKS[t])} <span class="n">${cc.due+cc.learn?cc.due+cc.learn+" fällig · ":""}${n}</span></button>`}).join("")}</div>
  </section>
  <section class="panel">
    <div class="qhead"><h2>Neue Karten pro Tag</h2><span class="stats">heute ${kkNewDone()} gelernt</span></div>
    <div class="chips">${[20,30,50,9999].map(n=>`<button class="chip" data-nl="${n}" aria-pressed="${nl===n}">${n>999?"alle":n}</button>`).join("")}</div>
    <p class="sub">Prüfung am 19.11.: lieber „alle“ oder 50 wählen. Fortschritt bleibt nur in diesem Browser.</p>
    <div class="row"><button class="btn ghost sm" id="kk-reset">Fortschritt der Karten zurücksetzen</button></div>
    <div id="kk-confirm" hidden class="row"><span class="stats">Wirklich alles zurücksetzen?</span><button class="btn sm" id="kk-yes">Ja, zurücksetzen</button><button class="btn ghost sm" id="kk-no">Abbrechen</button></div>
  </section>`;
  const $=x=>app.querySelector(x);
  $("#kk-go").onclick=()=>kkStart(false);
  $("#kk-cram").onclick=()=>kkStart(true);
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const t=+b.dataset.d; kkDecks=kkDecks.includes(t)?kkDecks.filter(x=>x!==t):kkDecks.concat(t); store.set("guk_kkdecks",kkDecks); karten();});
  $("#kk-all").onclick=()=>{kkDecks=Object.keys(KDECKS).map(Number);store.set("guk_kkdecks",kkDecks);karten();};
  $("#kk-none").onclick=()=>{kkDecks=[];store.set("guk_kkdecks",kkDecks);karten();};
  app.querySelectorAll("[data-nl]").forEach(b=>b.onclick=()=>{store.set("guk_kknew",+b.dataset.nl);karten();});
  $("#kk-reset").onclick=()=>{$("#kk-confirm").hidden=false;};
  $("#kk-no").onclick=()=>{$("#kk-confirm").hidden=true;};
  $("#kk-yes").onclick=()=>{KS={};store.set("guk_kk",KS);store.set("guk_kkday",{});karten();};
  window.scrollTo(0,0);
}
function kkStart(cram){
  const pool=kkPool(); KK.cram=cram; KK.done=0; KK.flip=false;
  if(cram){ KK.q=shuffle(pool.map(c=>c.id)); }
  else{ const now=Date.now(); const due=pool.filter(c=>KS[c.id]&&KS[c.id].d<=now).sort((a,b)=>KS[a.id].d-KS[b.id].d).map(c=>c.id);
    const left=Math.max(0,kkNewLimit()-kkNewDone()); const neu=pool.filter(c=>!KS[c.id]).slice(0,left).map(c=>c.id);
    KK.q=[]; let i=0,j=0; while(i<due.length||j<neu.length){ if(i<due.length)KK.q.push(due[i++]); if(i<due.length)KK.q.push(due[i++]); if(j<neu.length)KK.q.push(neu[j++]); } }
  KK.total=KK.q.length; kkShow();
}
function kkShow(){
  hideSide();
  if(!KK.q.length){ app.innerHTML=`<section class="panel"><h2>${KK.cram?"Stapel durch":"Geschafft für jetzt"}</h2><p class="sub">${KK.done} Karten bewertet.${KK.cram?"":" Fällige Karten kommen zum geplanten Zeitpunkt wieder."}</p>
    <div class="row"><button class="btn" id="kk-back">Zur Übersicht</button>${KK.cram?`<button class="btn ghost" id="kk-again">Nochmal mischen</button>`:""}</div></section>`;
    app.querySelector("#kk-back").onclick=()=>karten(); if(KK.cram)app.querySelector("#kk-again").onclick=()=>kkStart(true); window.scrollTo(0,0); return; }
  const c=KARTEN.find(x=>x.id===KK.q[0]); KK.cur=c;
  const cnt=KK.cram?null:(()=>{let n=0,l=0,d=0; KK.q.forEach(id=>{const s=KS[id]; if(!s)n++; else if(s.i<1)l++; else d++;}); return {n,l,d};})();
  const s=KS[c.id];
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="kk-x">← Übersicht</button>
   ${KK.cram?`<span class="stats">${KK.done} / ${KK.total} · ohne Planung</span>`:`<span class="kk-cnt"><b class="kk-n">${cnt.n}</b><b class="kk-l">${cnt.l}</b><b class="kk-d">${cnt.d}</b></span>`}</div>
  <button class="kk-card${KK.flip?" back":""}" id="kk-card" aria-label="Karte umdrehen">
    <span class="kk-deck">${esc(KDECKS[c.t])}${!KK.cram&&!s?" · neu":""}</span>
    <span class="kk-f">${esc(c.f)}</span>
    ${KK.flip?`<span class="kk-hr"></span><span class="kk-b">${esc(c.b)}</span>`:`<span class="kk-hint">Tippen zum Umdrehen</span>`}
  </button>
  ${KK.flip?(KK.cram?`<div class="kk-rate two"><button class="kk-g g0" data-g="0"><b>Nicht gewusst</b></button><button class="kk-g g2" data-g="2"><b>Gewusst</b></button></div>`:
   `<div class="kk-rate">${["Nochmal","Schwer","Gut","Einfach"].map((n,g)=>`<button class="kk-g g${g}" data-g="${g}"><span>${kkFmt(kkNext(c,g).ms)}</span><b>${n}</b></button>`).join("")}</div>`)
   :`<div class="row"><button class="btn kk-show" id="kk-flip">Antwort zeigen</button></div>`}
  <p class="stats kk-keys">Tastatur: Leertaste = umdrehen${KK.cram?"":" · 1–4 = bewerten"}</p>`;
  const $=x=>app.querySelector(x);
  $("#kk-x").onclick=()=>karten();
  $("#kk-card").onclick=()=>{KK.flip=!KK.flip;kkShow();};
  if($("#kk-flip"))$("#kk-flip").onclick=()=>{KK.flip=true;kkShow();};
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>kkRate(+b.dataset.g));
}
function kkRate(g){
  const c=KK.cur; if(!c)return; KK.q.shift(); KK.done++; KK.flip=false;
  if(KK.cram){ if(g===0)KK.q.push(c.id); }
  else{ const wasNew=!KS[c.id]; const n=kkNext(c,g); delete n.ms; KS[c.id]=n; store.set("guk_kk",KS); if(wasNew)kkNewInc();
    if(n.d-Date.now()<=20*MINUTE){ const pos=Math.min(KK.q.length,g===0?3:g===1?6:10); KK.q.splice(pos,0,c.id); } }
  kkShow(); window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if(!KK.cur||!document.getElementById("kk-card")||e.target.closest("input,textarea"))return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); KK.flip=!KK.flip; kkShow(); }
  else if(KK.flip&&/^[1-4]$/.test(e.key)){ const g=+e.key-1; if(KK.cram){ if(g===0||g===2)kkRate(g); else if(g===3)kkRate(2); } else kkRate(g); }
});

/* ---------- Bilder: beschriften / finden / erkennen ---------- */
let imDone=store.get("mgl_im",{});
const IM={};
const IMODE={label:"Beschriften",find:"Finden",what:"Erkennen"};
function imSkinAttr(){ try{ document.documentElement.setAttribute("data-skin",curSkin()); }catch(e){} }
function imSvg(x,opt){
  opt=opt||{};
  const mk=x.pts.map((p,i)=>{
    if(opt.only!=null&&opt.only!==i) return "";
    const st=opt.state&&opt.state[i]?" "+opt.state[i]:"";
    const num=opt.nums===false?"":(i+1);
    return `<g class="mk${st}" data-i="${i}" tabindex="0" role="button" aria-label="Markierung ${i+1}"><circle class="hit" cx="${p[0]}" cy="${p[1]}" r="20"/><circle class="dot" cx="${p[0]}" cy="${p[1]}" r="${opt.nums===false?9:11}"/>${num!==""?`<text x="${p[0]}" y="${p[1]}">${num}</text>`:""}</g>`;}).join("");
  return `<svg class="im-svg" viewBox="${x.vb}" role="img" aria-label="${esc(x.title)}"><g class="im-art">${x.svg}</g>${opt.thumb?"":mk}</svg>`;
}
function imgHome(){
  hideSide(); imSkinAttr();
  const n=IMG.filter(x=>imDone[x.id]).length;
  const groups={}; IMG.forEach(x=>(groups[x.t]=groups[x.t]||[]).push(x));
  app.innerHTML=`
  <header class="head"><div class="status"><span class="dot"></span>Bildaufgaben · ${IMG.length} Schemata</div><h1><span class="x">Bilder</span> beschriften</h1>
   <p class="sub">Drei Spielarten pro Bild: <b>Beschriften</b> (Nummern zuordnen), <b>Finden</b> (Struktur im Bild antippen), <b>Erkennen</b> (Was ist markiert?). Schemata nach den Folien vereinfacht gezeichnet.</p></header>
  <section class="panel"><div class="qhead"><h2>Bild-Mix</h2><span class="stats">${n}/${IMG.length} Bilder komplett richtig</span></div>
   <p class="sub">20 zufällige Finden- und Erkennen-Aufgaben aus allen Bildern.</p>
   <div class="row"><button class="btn" id="im-mix2">Mix starten</button></div></section>
  ${Object.keys(TOPICS).filter(t=>groups[t]).map(t=>`<h2>${esc(TOPICS[t])}</h2><div class="im-grid">${groups[t].map(x=>`
   <section class="panel im-card"><button class="im-thumb" data-go="${x.id}" aria-label="${esc(x.title)} beschriften">${imSvg(x,{thumb:true})}</button>
    <div class="qhead"><h3>${esc(x.title)}</h3>${imDone[x.id]?'<span class="sk-ok">✓</span>':""}</div>
    <span class="stats">${x.pts.length} Strukturen</span>
    <div class="row tight"><button class="btn sm" data-m="label" data-id="${x.id}">Beschriften</button><button class="btn ghost sm" data-m="find" data-id="${x.id}">Finden</button><button class="btn ghost sm" data-m="what" data-id="${x.id}">Erkennen</button></div>
   </section>`).join("")}</div>`).join("")}`;
  app.querySelector("#im-mix2").onclick=()=>imgMix();
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>imgPlay(b.dataset.id,b.dataset.m));
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>imgPlay(b.dataset.go,"label"));
  window.scrollTo(0,0);
}
function imgPlay(id,mode){
  hideSide(); imSkinAttr();
  const x=IMG.find(y=>y.id===id);
  IM.x=x; IM.mode=mode; IM.mix=null;
  if(mode==="label"){ IM.as=x.pts.map(()=>null); IM.act=0; IM.checked=false; IM.bank=shuffle(x.pts.map((_,i)=>i)); imLabelView(); }
  else { IM.q=shuffle(x.pts.map((_,i)=>({x,i,mode}))); IM.k=0; IM.ok=0; IM.ans=null; imQView(); }
  window.scrollTo(0,0);
}
function imgMix(){
  hideSide(); imSkinAttr();
  const all=[]; IMG.forEach(x=>x.pts.forEach((_,i)=>all.push({x,i,mode:Math.random()<.5?"find":"what"})));
  IM.q=shuffle(all).slice(0,20); IM.k=0; IM.ok=0; IM.ans=null; IM.mix=true; IM.x=null; IM.mode="mix";
  imQView(); window.scrollTo(0,0);
}
function imTop(title,sub){
  return `<div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="im-back">← Bilder</button><span class="stats">${sub}</span></div>`;
}
function imLabelView(){
  const x=IM.x, used=new Set(IM.as.filter(v=>v!=null));
  const state=x.pts.map((_,i)=>IM.checked?(IM.as[i]===i?"ok":"bad"):(i===IM.act?"act":(IM.as[i]!=null?"set":"")));
  const nOk=IM.as.filter((v,i)=>v===i).length;
  app.innerHTML=`${imTop(x.title,"Beschriften")}
  <section class="panel">
   <div class="qhead"><span class="type">${esc(TOPICS[x.t])}</span><span class="label">${x.pts.length} Nummern</span></div>
   <p class="q">${esc(x.title)}</p>
   <div class="im-wrap">${imSvg(x,{state})}</div>
   <p class="sub">${IM.checked?"":"Nummer antippen (im Bild oder in der Liste), dann den Begriff aus der Wortbank wählen."}</p>
   <ol class="im-rows">${x.pts.map((p,i)=>`<li class="${state[i]}" data-r="${i}"><span class="im-n">${i+1}</span><span class="im-l">${IM.as[i]!=null?esc(x.pts[IM.as[i]][2]):"…"}</span>${IM.checked&&IM.as[i]!==i?`<span class="im-c">→ ${esc(p[2])}</span>`:""}</li>`).join("")}</ol>
   ${IM.checked?"":`<span class="label">Wortbank</span><div class="chips im-bank">${IM.bank.map(j=>`<button class="chip" data-b="${j}" ${used.has(j)?'aria-pressed="true"':""}>${esc(x.pts[j][2])}</button>`).join("")}</div>`}
   ${IM.checked?`<div class="note ${nOk===x.pts.length?"":"warn"}"><b>${nOk} / ${x.pts.length} richtig</b>${x.note?" · "+esc(x.note):""}</div><span class="stats">Quelle: ${esc(x.src)}</span>`:""}
   <div class="row">${IM.checked?`<button class="btn" id="im-again">Nochmal</button><button class="btn ghost" id="im-find">Finden üben</button><button class="btn ghost" id="im-what">Erkennen üben</button>`:`<button class="btn" id="im-chk" ${IM.as.every(v=>v!=null)?"":"disabled"}>Prüfen</button><button class="btn ghost" id="im-clr">Leeren</button><button class="btn ghost" id="im-sol">Lösung zeigen</button>`}</div>
  </section>`;
  const $=s=>app.querySelector(s);
  $("#im-back").onclick=()=>imgHome();
  const pick=i=>{ if(IM.checked)return; IM.act=i; imLabelView(); };
  app.querySelectorAll(".mk").forEach(g=>{g.onclick=()=>pick(+g.dataset.i); g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(+g.dataset.i);}};});
  app.querySelectorAll("[data-r]").forEach(li=>li.onclick=()=>pick(+li.dataset.r));
  app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.b;
    const prev=IM.as.indexOf(j); if(prev>=0) IM.as[prev]=null;
    IM.as[IM.act]=j;
    const nx=IM.as.findIndex((v,k)=>v==null&&k>IM.act), any=IM.as.findIndex(v=>v==null);
    IM.act=nx>=0?nx:(any>=0?any:IM.act); imLabelView(); });
  if($("#im-chk"))$("#im-chk").onclick=()=>{ IM.checked=true; if(IM.as.every((v,i)=>v===i)){imDone[IM.x.id]=1;store.set("mgl_im",imDone);} imLabelView(); };
  if($("#im-clr"))$("#im-clr").onclick=()=>{ IM.as=IM.x.pts.map(()=>null); IM.act=0; imLabelView(); };
  if($("#im-sol"))$("#im-sol").onclick=()=>{ IM.as=IM.x.pts.map((_,i)=>i); IM.checked=true; imLabelView(); };
  if($("#im-again"))$("#im-again").onclick=()=>imgPlay(IM.x.id,"label");
  if($("#im-find"))$("#im-find").onclick=()=>imgPlay(IM.x.id,"find");
  if($("#im-what"))$("#im-what").onclick=()=>imgPlay(IM.x.id,"what");
}
function imOpts(it){
  const own=it.x.pts.map((p,i)=>i).filter(i=>i!==it.i);
  const o=shuffle(own).slice(0,3).concat([it.i]);
  return shuffle(o);
}
function imQView(){
  const it=IM.q[IM.k];
  if(!it) return imEnd();
  const x=it.x, a=IM.ans;
  if(it.mode==="what"&&!it.opts) it.opts=imOpts(it);
  let state=null, svg;
  if(it.mode==="find"){
    state=x.pts.map((_,i)=>a==null?"":(i===it.i?"ok":(i===a?"bad":"dim")));
    svg=imSvg(x,{state,nums:false});
  } else {
    state=x.pts.map((_,i)=>i===it.i?(a==null?"act":(a===it.i?"ok":"bad")):"");
    svg=imSvg(x,{state,only:it.i,nums:false});
  }
  app.innerHTML=`${imTop("",IM.mix?"Bild-Mix":IMODE[it.mode])}
  <section class="panel">
   <div class="qhead"><span class="type">${it.mode==="find"?"Im Bild finden":"Was ist markiert?"}</span><span class="label">${IM.k+1} / ${IM.q.length} · ${IM.ok} richtig</span></div>
   <span class="stats">${esc(x.title)}</span>
   <p class="q">${it.mode==="find"?`Tippe auf: <b>${esc(x.pts[it.i][2])}</b>`:"Wie heißt die markierte Struktur?"}</p>
   <div class="im-wrap">${svg}</div>
   ${it.mode==="what"?`<div class="opts">${it.opts.map(j=>`<button class="opt im-opt ${a==null?"":(j===it.i?"right":(j===a?"wrong":""))}" data-o="${j}" ${a!=null?"disabled":""}><span>${esc(x.pts[j][2])}</span></button>`).join("")}</div>`:""}
   ${a!=null?`<div class="note ${a===it.i?"":"warn"}">${a===it.i?"✓ Richtig":"✗ Richtig wäre: <b>"+esc(x.pts[it.i][2])+"</b>"}</div>
   <div class="row"><button class="btn" id="im-next">${IM.k+1<IM.q.length?"Weiter":"Auswertung"}</button></div>`:""}
  </section>`;
  app.querySelector("#im-back").onclick=()=>imgHome();
  const answer=j=>{ if(IM.ans!=null)return; IM.ans=j; if(j===it.i)IM.ok++; imQView(); };
  if(it.mode==="find"&&a==null) app.querySelectorAll(".mk").forEach(g=>{g.onclick=()=>answer(+g.dataset.i); g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();answer(+g.dataset.i);}};});
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  const nx=app.querySelector("#im-next"); if(nx){ nx.onclick=()=>{IM.k++;IM.ans=null;imQView();window.scrollTo(0,0);}; nx.focus({preventScroll:true}); }
}
function imEnd(){
  const n=IM.q.length, pct=Math.round(IM.ok/n*100);
  app.innerHTML=`${imTop("","Ergebnis")}
  <section class="panel"><div class="qhead"><h2>${IM.mix?"Bild-Mix":esc(IM.x.title)}</h2><span class="stats">${IMODE[IM.mode]||"Mix"}</span></div>
   <p class="q">${IM.ok} / ${n} richtig · ${pct} %</p>
   <div class="row"><button class="btn" id="im-re">Nochmal</button><button class="btn ghost" id="im-h">Alle Bilder</button>${IM.mix?"":`<button class="btn ghost" id="im-lab">Beschriften</button>`}</div></section>`;
  app.querySelector("#im-back").onclick=()=>imgHome();
  app.querySelector("#im-h").onclick=()=>imgHome();
  app.querySelector("#im-re").onclick=()=>IM.mix?imgMix():imgPlay(IM.x.id,IM.mode);
  const l=app.querySelector("#im-lab"); if(l)l.onclick=()=>imgPlay(IM.x.id,"label");
}
/* ---------- Lückentext ---------- */
let clDone=store.get("mgl_cl",{});
const CL={};
function clStart(list){ if(!list.length)return; hideSide(); CL.list=list; CL.i=0; clLoad(); }
function clLoad(){ const c=CL.list[CL.i]; CL.c=c; CL.gaps=(c.t2.match(/\[[^\]]+\]/g)||[]).map(s=>s.slice(1,-1)); CL.fill=CL.gaps.map(()=>null); CL.act=0; CL.checked=false;
  CL.bank=shuffle(CL.gaps.map((g,i)=>({w:g,i})).concat((c.extra||[]).map(w=>({w,i:-1})))); clView(); window.scrollTo(0,0); }
function clView(){
  const c=CL.c; let k=0;
  const used=new Set(CL.fill.filter(v=>v!=null));
  const txt=esc(c.t2).replace(/\[[^\]]+\]/g,()=>{ const i=k++; const f=CL.fill[i]; const ok=CL.checked?(f!=null&&CL.bank[f].w===CL.gaps[i]):null;
    return `<button class="gap ${i===CL.act&&!CL.checked?"act":""} ${ok===true?"ok":ok===false?"bad":""}" data-g="${i}">${f!=null?esc(CL.bank[f].w):"_____"}</button>${ok===false?`<span class="im-c">(${esc(CL.gaps[i])})</span>`:""}`; });
  const nOk=CL.checked?CL.fill.filter((f,i)=>f!=null&&CL.bank[f].w===CL.gaps[i]).length:0;
  app.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Start</button><span class="stats">Lückentext ${CL.i+1} / ${CL.list.length}</span></div>
  <section class="panel"><div class="qhead"><span class="type">${esc(TOPICS[c.t])}</span><span class="label">${CL.gaps.length} Lücken</span></div>
   <p class="q">${esc(c.title)}</p>
   <p class="cl-t">${txt}</p>
   ${CL.checked?`<div class="note ${nOk===CL.gaps.length?"":"warn"}"><b>${nOk} / ${CL.gaps.length} richtig</b></div><span class="stats">Quelle: ${esc(c.src)}</span>`:`<span class="label">Wortbank</span><div class="chips">${CL.bank.map((b,j)=>`<button class="chip" data-w="${j}" ${used.has(j)?'aria-pressed="true"':""}>${esc(b.w)}</button>`).join("")}</div>`}
   <div class="row">${CL.checked?`<button class="btn" id="cl-next">${CL.i+1<CL.list.length?"Nächster":"Fertig"}</button><button class="btn ghost" id="cl-re">Nochmal</button>`:`<button class="btn" id="cl-chk" ${CL.fill.every(v=>v!=null)?"":"disabled"}>Prüfen</button><button class="btn ghost" id="cl-skip">Überspringen</button>`}</div>
  </section>`;
  const $=s=>app.querySelector(s);
  $("#back").onclick=()=>home();
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ if(CL.checked)return; const i=+b.dataset.g; if(CL.fill[i]!=null&&CL.act===i)CL.fill[i]=null; CL.act=i; clView(); });
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.w; const prev=CL.fill.indexOf(j); if(prev>=0)CL.fill[prev]=null; CL.fill[CL.act]=j;
    const nx=CL.fill.findIndex((v,k)=>v==null&&k>CL.act), any=CL.fill.findIndex(v=>v==null); CL.act=nx>=0?nx:(any>=0?any:CL.act); clView(); });
  if($("#cl-chk"))$("#cl-chk").onclick=()=>{ CL.checked=true; if(CL.fill.every((f,i)=>CL.bank[f].w===CL.gaps[i])){clDone[c.id]=1;store.set("mgl_cl",clDone);} clView(); };
  if($("#cl-skip"))$("#cl-skip").onclick=()=>{ CL.i=(CL.i+1)%CL.list.length; clLoad(); };
  if($("#cl-next"))$("#cl-next").onclick=()=>{ if(CL.i+1<CL.list.length){CL.i++;clLoad();} else home(); };
  if($("#cl-re"))$("#cl-re").onclick=()=>clLoad();
}

/* ---------- Design-Auswahl ---------- */
const SKINS=[["light","Weiß-Grün"],["dark","Schwarz-Grün"],["system","Auto"],["cyber","Neon-Grün"]];
const HOST_THEME=document.documentElement.getAttribute("data-theme");
function curSkin(){ return store.get("mgl_skin","light"); }
function applySkin(v){ const c=document.getElementById("css-cyber"), o=document.getElementById("css-oneui"), r=document.documentElement;
  c.media=v==="cyber"?"all":"not all"; o.media=v==="cyber"?"not all":"all";
  if(v==="light"||v==="dark")r.setAttribute("data-theme",v); else if(HOST_THEME)r.setAttribute("data-theme",HOST_THEME); else r.removeAttribute("data-theme"); }
function setSkin(v){ store.set("mgl_skin",v); applySkin(v); }
applySkin(curSkin());

/* ---------- Countdown ---------- */
const EXAMS=[["2027-01-19","Di 19.01.2027"],["2027-01-29","Fr 29.01.2027"],["2027-03-12","WH Fr 12.03.2027"]];
function curExam(){ return store.get("mgl_exam","2027-01-19"); }
function cdText(){ const [y,m,d]=curExam().split("-").map(Number); const ms=new Date(y,m-1,d,8)-new Date();
  if(ms<=0&&ms>-16*36e5) return "<b>Heute ist Prüfung – viel Erfolg! 🍀</b>";
  if(ms<=0) return "Termin vorbei – wähle einen anderen Termin";
  const D=Math.floor(ms/864e5),H=Math.floor(ms/36e5)%24,M=Math.floor(ms/6e4)%60,S=Math.floor(ms/1e3)%60;
  return `<span>Noch bis zu deiner Prüfung · Termin wählen:</span><b>${D} T ${String(H).padStart(2,"0")}:${String(M).padStart(2,"0")}:${String(S).padStart(2,"0")}</b>`; }
setInterval(()=>{const e=document.getElementById("cd"); if(e)e.innerHTML=cdText();},1000);
tick();
home();
</script>
