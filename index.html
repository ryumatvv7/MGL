<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><style>#hubback{display:inline-flex;align-items:center;gap:6px;margin:calc(10px + env(safe-area-inset-top)) 0 0 max(14px,env(safe-area-inset-left));padding:7px 13px;border-radius:99px;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:inherit;text-decoration:none;opacity:.72;border:1px solid currentColor;border-color:color-mix(in srgb,currentColor 25%,transparent);position:relative;z-index:5}#hubback:hover,#hubback:focus-visible{opacity:1}@media print{#hubback{display:none}}</style><a id="hubback" href="https://ryumatvv7.github.io/" aria-label="Zurück zur Übersicht aller Prüfungstrainer">← Alle Fächer</a>
<title>MGL 1 Prüfungstrainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style id="css-cyber" media="not all">.cd{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line-strong);padding:16px 18px;margin-top:6px}.cd-t{display:flex;flex-direction:column;gap:2px}.cd-t span{font-size:13.5px;color:var(--muted)}.cd-t b{font-size:30px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Layout: AMOLED-black nursing HUD tuned for Samsung/One UI – thumb-reach bottom tab bar, 52px targets, panels with corner brackets; Fehleranalyse docks right on wide screens; clock above the tab bar. Based on: one column of med-response HUD panels with cut corners and corner brackets; Fehleranalyse docks right on wide screens; clock/timer bottom-right. Deliberately single dark theme (night-city medical HUD): black glass, mint-cyan signal colour, white type, red for errors. */
:root{
  --bg:#000000; --bg2:#02070d; --panel:rgba(6,18,23,.86); --panel-hi:rgba(10,32,38,.92);
  --ink:#e4f3f0; --muted:#7c9896; --qink:#ffffff;
  --line:rgba(57,255,136,.20); --line-strong:rgba(57,255,136,.55);
  --accent:#39ff88; --accent-ink:#00170a; --accent-soft:rgba(57,255,136,.09); --glow:rgba(57,255,136,.35);
  --ok:#7dffb0; --ok-soft:rgba(125,255,176,.10); --bad:#ff3358; --bad-soft:rgba(255,51,88,.12); --bad-line:rgba(255,51,88,.55);
  --warn:#ffd23f; --hudbg:rgba(2,9,11,.88); --grid:rgba(57,255,136,.035);
  --f-display:"Chakra Petch","Exo 2","Segoe UI",sans-serif;
  --f-body:"Exo 2","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --cut:12px; --cut-s:7px; --gap:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;font-weight:500;line-height:1.45;min-height:100%;
  background-image:
    radial-gradient(ellipse 80% 45% at 50% -10%, rgba(57,255,136,.13), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(180deg,var(--bg2),var(--bg) 55%);
  background-size:auto,44px 44px,44px 44px,auto;
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 170px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
::selection{background:var(--accent);color:var(--accent-ink)}
.layout{display:grid;gap:20px;max-width:1220px;margin:0 auto;align-items:start}
.wrap{width:100%;max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
@media (min-width:1100px){
  .layout.has-side{grid-template-columns:minmax(0,700px) minmax(0,440px);justify-content:center}
  .layout.has-side .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 120px);overflow:auto}
}
/* header */
.head{display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.status{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.status .dot{width:8px;height:8px;background:var(--accent);box-shadow:0 0 8px var(--glow);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,48px);line-height:.98;margin:0;text-transform:uppercase;letter-spacing:.03em;color:var(--qink);text-wrap:balance}
h1 .x{color:var(--accent);text-shadow:0 0 14px var(--glow)}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
h2::before{content:"// ";opacity:.55}
h3{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;color:var(--qink);letter-spacing:.02em}
.sub{color:var(--muted);margin:0;max-width:60ch}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:.8}
.ecg{display:block;width:100%;height:auto;max-height:44px;overflow:visible}
.ecg path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--glow))}
.ecg .base{stroke:var(--line);filter:none}
.ecg .trace{stroke-dasharray:130 1000;animation:trace 2.4s linear infinite}
@keyframes trace{from{stroke-dashoffset:130}to{stroke-dashoffset:-1000}}
/* panels: hairline border + corner brackets */
.panel{position:relative;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:var(--gap);min-width:0;
  background:
    linear-gradient(var(--accent),var(--accent)) top left/16px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top left/2px 16px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/16px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/2px 16px no-repeat,
    var(--panel)}
.panel.resume{border-color:var(--line-strong);box-shadow:0 0 0 1px var(--accent-soft),0 0 24px -8px var(--glow)}
.panel.missing{border-color:rgba(255,210,63,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-family:var(--f-display);font-size:14.5px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 11px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-transform:uppercase;letter-spacing:.05em;text-align:left;
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.chip .n{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent)}
.chip:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.tight{gap:6px}
.btn{font:inherit;font-family:var(--f-display);font-weight:700;font-size:15.5px;text-transform:uppercase;letter-spacing:.12em;padding:11px 22px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.btn.ghost{background:var(--accent-soft);color:var(--accent);border-color:var(--line-strong)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible,.chip:focus-visible,.mode:focus-visible,.cell:focus-visible,.counter:focus-visible,.step:focus-visible,.opt:has(input:focus-visible){outline:2px solid var(--warn);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:14px 16px 14px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.mode::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--line-strong)}
.mode b{font-family:var(--f-display);font-size:18.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--qink);overflow-wrap:anywhere;hyphens:auto}
.mode span{color:var(--muted);font-size:14.5px;line-height:1.35}
.mode.hot{border-color:var(--bad-line);background:linear-gradient(135deg,rgba(255,51,88,.14),var(--panel) 60%)}
.mode.hot::before{background:var(--bad)}
.mode.hot b{color:#ffd9e0}
.mode:disabled{opacity:.32;cursor:default}
.bar{height:6px;overflow:hidden;background:repeating-linear-gradient(90deg, rgba(57,255,136,.14) 0 6px, transparent 6px 9px)}
.bar i{display:block;height:100%;width:0;transition:width .25s;background:repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 9px);filter:drop-shadow(0 0 4px var(--glow))}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.type{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line-strong);color:var(--accent);background:var(--accent-soft)}
.type.mc{border-color:rgba(255,210,63,.6);color:var(--warn);background:rgba(255,210,63,.08)}
.q{font-size:20.5px;font-weight:600;margin:0;text-wrap:pretty;color:var(--qink);overflow-wrap:anywhere}
.q .neg{color:var(--warn);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:11px 13px;cursor:pointer;background:rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ff8ea2;box-shadow:inset 3px 0 0 var(--bad)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding-top:4px}
@media (hover:hover){
  .chip:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink)}
  .mode:hover:not(:disabled){border-color:var(--line-strong);background:var(--panel-hi)}
  .mode.hot:hover:not(:disabled){border-color:var(--bad)}
  .opt:hover:not(.sel):not(.right):not(.wrong){border-color:var(--line-strong)}
  .btn:hover:not(:disabled){filter:brightness(1.12)}
  .step:hover:not(:disabled){border-color:var(--line-strong)}
}
.verdict{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:3px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict strong{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.14em}
.verdict.ok strong{color:var(--ok)} .verdict.bad strong{color:var(--bad)}
.score{font-family:var(--f-display);font-weight:700;font-size:68px;line-height:.9;color:var(--qink);font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--glow)}
.score .of{font-size:28px;color:var(--muted);text-shadow:none}
.pill{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 12px;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.wrongs{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.wrongs li{border-left:3px solid var(--bad);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.wrongs .a{color:var(--muted);font-size:15.5px}
.wrongs .a.mine{color:#ff8ea2}
.wrongs .a.ex{font-size:14.5px}
.stats{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
/* Fehleranalyse: red alert variant */
.side{border:1px solid var(--bad-line);padding:18px;display:flex;flex-direction:column;gap:var(--gap);min-width:0;
  background:
    linear-gradient(var(--bad),var(--bad)) top left/16px 2px no-repeat,
    linear-gradient(var(--bad),var(--bad)) top left/2px 16px no-repeat,
    linear-gradient(var(--bad),var(--bad)) bottom right/16px 2px no-repeat,
    linear-gradient(var(--bad),var(--bad)) bottom right/2px 16px no-repeat,
    linear-gradient(180deg,rgba(255,51,88,.08),transparent 120px),
    var(--panel)}
.side h2{color:var(--bad)}
.side .sec{display:flex;flex-direction:column;gap:8px}
.ana{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ana li{border-left:3px solid var(--line);padding:4px 0 4px 10px;font-size:15.5px;overflow-wrap:anywhere}
.ana li.must{border-color:var(--ok)}
.ana li.err{background:var(--bad-soft)}
.ana .st{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.ana li.err .st{color:var(--bad)}
.key{font-size:15.5px;border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft)}
.key.warnkey{border-color:var(--bad);background:var(--bad-soft)}
.key b{color:var(--bad)}
.ai{font-size:16px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.ai p{margin:0}
.ai .li{padding-left:14px;text-indent:-12px}
.ai b{color:var(--accent);font-weight:700}
.ai .wait{font-family:var(--f-mono);color:var(--muted);letter-spacing:.06em;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.side .btn{padding:8px 14px;font-size:13.5px}
/* bottom-right readout */
.hud{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20;pointer-events:none}
.hud-box{background:var(--hudbg);border:1px solid var(--line-strong);padding:6px 12px;display:flex;align-items:baseline;gap:8px;backdrop-filter:blur(4px);
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.hud-l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#clock,#timer{font-family:var(--f-mono);font-weight:700;font-size:21px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 0 8px var(--glow)}
.hud-box.low{border-color:var(--bad)} .hud-box.low #timer{color:var(--bad);text-shadow:0 0 8px rgba(255,51,88,.5)}
.hud-box.sig .tag{font-family:var(--f-mono);font-size:13px;color:var(--qink);letter-spacing:.03em}
[hidden]{display:none!important}
.navbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.navbar .btn.sm{font-size:20px;line-height:1;padding:6px 16px}
.counter{font:inherit;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:8px 10px;cursor:pointer;text-align:center}
.counter b{color:var(--qink);font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.counter .caret{color:var(--accent);margin-left:4px}
.gridp{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:260px;overflow:auto}
.cell{font:inherit;font-family:var(--f-mono);font-size:12.5px;height:34px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.ans{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent)}
.cell.cur{outline:2px solid var(--qink);outline-offset:1px;color:var(--qink)}
.legend{gap:14px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i.cell{width:14px;height:14px;display:inline-block;cursor:default}
.cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Abläufe */
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mt-pool,.mt-bin .drop{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:1px dashed var(--line);background:rgba(0,0,0,.25)}
.mt-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.mt-bin{min-width:0}.mt-bin h4{margin:0 0 6px;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.mt-bin.over .drop,.mt-pool.over{border-color:var(--accent);background:rgba(0,240,255,.08)}
.chipd{font:inherit;font-size:15px;padding:8px 11px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left}
.chipd.sel{outline:2px solid var(--accent)}
.chipd.right{border-color:#3ddc84;color:#3ddc84}.chipd.wrong{border-color:#ff4d6d;color:#ff4d6d}
.chipd.ghost{position:fixed;pointer-events:none;z-index:999;opacity:.9;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.chipd .fix{display:block;font-size:12px;opacity:.85}
.oq-ta{width:100%;min-height:180px;font:inherit;font-size:16px;line-height:1.5;background:rgba(0,0,0,.4);color:var(--ink);border:1px solid var(--line);padding:10px 12px;resize:vertical}
.oq-ta:focus{outline:none;border-color:var(--accent)}
.oq-pts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.oq-pts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:8px 10px;cursor:pointer;font-size:15.5px;overflow-wrap:anywhere}
.oq-pts input{margin-top:3px;width:18px;height:18px;accent-color:var(--ok);flex:none}
.oq-pts label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.oq-model{white-space:pre-line;font-size:15.5px;line-height:1.55;border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft)}
.oq-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(255,210,63,.5);padding:2px 7px}
.step{font:inherit;font-size:16.5px;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;border:1px solid var(--line);padding:10px 12px;background:rgba(0,0,0,.35);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.step .no{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);min-width:22px;padding-top:3px}
.step.placed{border-color:var(--line-strong);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.step.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.step.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ff8ea2;cursor:default}
.step:disabled{cursor:default}
.slot{border:1px dashed var(--line);padding:10px 12px;color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.clist{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:26px}
.clist li{padding-left:4px;overflow-wrap:anywhere}
.clist li::marker{color:var(--accent);font-family:var(--f-mono);font-size:.85em}
.note{font-size:15.5px;color:var(--muted);border-left:3px solid var(--line-strong);padding:4px 10px}

/* Konspekt (eingebettet) */
.ksp{display:flex;flex-direction:column;gap:var(--gap);font-size:15.5px;line-height:1.5}
.ksp section{border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.ksp h2{font-size:18px;margin:0 0 4px}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;font-weight:400;line-height:1.45;min-height:100%;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 150px}
::selection{background:var(--accent-soft)}
.layout{display:grid;gap:16px;max-width:1180px;margin:0 auto;align-items:start}
.wrap{width:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
@media (min-width:1100px){
  .layout.has-side{grid-template-columns:minmax(0,680px) minmax(0,440px);justify-content:center}
  .layout.has-side .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 140px);overflow:auto}
}
/* large title area */
.head{display:flex;flex-direction:column;gap:8px;padding:clamp(28px,9vh,96px) 6px 10px}
.status{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.status .dot{display:none}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,8.5vw,44px);line-height:1.08;margin:0;letter-spacing:-.01em;color:var(--qink);text-wrap:balance}
h1 .x{color:var(--accent)}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;color:var(--qink);letter-spacing:0}
.wrap>h2{font-size:14px;font-weight:600;color:var(--muted);padding:14px 20px 0}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;color:var(--qink)}
.sub{color:var(--muted);margin:0;max-width:62ch;font-size:15.5px}
.head .sub{font-size:15.5px}
.label{font-size:13px;font-weight:600;color:var(--accent)}
.ecg{display:none}
/* cards */
.panel{position:relative;background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:var(--gap);min-width:0;box-shadow:var(--shadow)}
.panel.resume{background:var(--card)}
.panel.missing{box-shadow:inset 0 0 0 1.5px var(--warn-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:500;border:1px solid var(--line-strong);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-align:left;min-height:40px}
.chip .n{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.chip:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.tight{gap:6px}
.btn{font:inherit;font-weight:600;font-size:16px;padding:11px 22px;min-height:46px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent;transition:transform .1s, filter .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--accent)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:14.5px}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.chip:focus-visible,.mode:focus-visible,.cell:focus-visible,.counter:focus-visible,.step:focus-visible,.opt:has(input:focus-visible),.tabbar button:focus-visible,.knav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.mode{font:inherit;text-align:left;border:0;background:var(--card);color:var(--ink);padding:16px 18px;border-radius:var(--r-m);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;-webkit-tap-highlight-color:transparent}
.mode b{font-size:17px;font-weight:600;color:var(--qink);overflow-wrap:anywhere;hyphens:auto}
.mode span{color:var(--muted);font-size:14px;line-height:1.35}
.panel .mode{background:var(--card2)}
.mode.hot{background:var(--bad-soft)}
.mode.hot b{color:var(--bad)}
.mode:disabled{opacity:.4;cursor:default}
.mode:active:not(:disabled){transform:scale(.98)}
.bar{height:6px;overflow:hidden;border-radius:999px;background:var(--card3)}
.bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .25s;background:var(--accent)}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.type{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;color:var(--accent);background:var(--accent-soft)}
.type.mc{color:var(--warn);background:var(--warn-soft)}
.q{font-size:20px;font-weight:600;line-height:1.35;margin:0;text-wrap:pretty;color:var(--qink);overflow-wrap:anywhere}
.q .neg{color:var(--bad);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:center;border:1.5px solid transparent;padding:13px 16px;min-height:54px;border-radius:var(--r-m);cursor:pointer;background:var(--card2);-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.opt input{margin:0;width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
@media (hover:hover){
  .chip:hover:not(:disabled){background:var(--card2)}
  .chip[aria-pressed="true"]:hover{background:var(--accent-soft)}
  .mode:hover:not(:disabled){filter:brightness(.97)}
  .mode.hot:hover:not(:disabled){filter:brightness(.97)}
  .opt:hover:not(.sel):not(.right):not(.wrong){background:var(--card3)}
  .btn:hover:not(:disabled){filter:brightness(1.07)}
  .step:hover:not(:disabled){background:var(--card3)}
}
.verdict{padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-radius:var(--r-m)}
.verdict.ok{background:var(--ok-soft)}
.verdict.bad{background:var(--bad-soft)}
.verdict strong{font-size:17px;font-weight:700}
.verdict.ok strong{color:var(--ok)} .verdict.bad strong{color:var(--bad)}
.score{font-weight:700;font-size:64px;line-height:1;color:var(--qink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score .of{font-size:26px;color:var(--muted);font-weight:500}
.pill{display:inline-block;font-weight:600;padding:5px 14px;border-radius:999px}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)}
.wrongs{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.wrongs li{background:var(--card2);border-radius:var(--r-s);padding:12px 14px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.wrongs .a{color:var(--muted);font-size:15px}
.wrongs .a.mine{color:var(--bad)}
.wrongs .a.ex{font-size:14.5px}
.stats{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Fehleranalyse */
.side{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:var(--gap);min-width:0;box-shadow:var(--shadow)}
.side h2{color:var(--bad)}
.side .sec{display:flex;flex-direction:column;gap:8px}
.ana{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ana li{background:var(--card2);border-radius:var(--r-s);padding:10px 12px;font-size:15.5px;overflow-wrap:anywhere}
.ana li.must{box-shadow:inset 3px 0 0 var(--ok)}
.ana li.err{background:var(--bad-soft)}
.ana .st{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ana li.err .st{color:var(--bad)}
.key{font-size:15.5px;border-radius:var(--r-s);padding:10px 12px;background:var(--accent-soft)}
.key.warnkey{background:var(--bad-soft)}
.key b{color:var(--bad)}
.ai{font-size:16px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.ai p{margin:0}
.ai .li{padding-left:14px;text-indent:-12px}
.ai b{color:var(--accent);font-weight:700}
.ai .wait{color:var(--muted);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.side .btn{padding:9px 16px;font-size:15px;min-height:40px}
/* clock pill */
.hud{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:20;pointer-events:none}
.hud-box{background:var(--hudbg);border-radius:999px;padding:6px 12px;display:flex;align-items:baseline;gap:6px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.hud-l{font-size:11px;color:var(--muted)}
#clock,#timer{font-weight:600;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.hud-box.low #timer{color:var(--bad)}
.hud-box.sig .tag{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
.navbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.navbar .btn.sm{font-size:20px;line-height:1;width:44px;height:44px;padding:0;background:var(--card);color:var(--ink)}
.counter{font:inherit;font-size:14px;color:var(--muted);background:var(--card);border:0;border-radius:999px;padding:9px 12px;cursor:pointer;text-align:center;min-height:44px}
.counter b{color:var(--qink);font-size:18px;font-weight:700}
.counter .caret{color:var(--accent);margin-left:4px}
.gridp{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:260px;overflow:auto}
.cell{font:inherit;font-size:13px;height:36px;border:0;border-radius:12px;background:var(--card2);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-soft);color:var(--ok)}
.cell.bad{background:var(--bad-soft);color:var(--bad)}
.cell.ans{background:var(--accent-soft);color:var(--accent)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--qink)}
.legend{gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i.cell{width:14px;height:14px;display:inline-block;cursor:default;border-radius:5px}
.cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Abläufe, Zuordnen, Offen */
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mt-pool,.mt-bin .drop{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:var(--r-m);border:1.5px dashed var(--line-strong);background:var(--card2)}
.mt-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.mt-bin{min-width:0}.mt-bin h4{margin:0 0 6px 4px;overflow-wrap:anywhere;font-size:14px;font-weight:600;color:var(--accent)}
.mt-bin.over .drop,.mt-pool.over{border-color:var(--accent);background:var(--accent-soft)}
.chipd{font:inherit;font-size:15px;padding:9px 13px;border:0;border-radius:14px;background:var(--card);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chipd.sel{outline:2px solid var(--accent)}
.chipd.right{background:var(--ok-soft);color:var(--ok)}.chipd.wrong{background:var(--bad-soft);color:var(--bad)}
.chipd.ghost{position:fixed;pointer-events:none;z-index:999;opacity:.95;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.chipd .fix{display:block;font-size:12px;opacity:.85}
.oq-ta{width:100%;min-height:180px;font:inherit;font-size:16px;line-height:1.5;background:var(--card2);color:var(--ink);border:1.5px solid transparent;border-radius:var(--r-m);padding:12px 14px;resize:vertical}
.oq-ta:focus{outline:none;border-color:var(--accent)}
.oq-pts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.oq-pts label{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid transparent;border-radius:var(--r-s);padding:11px 13px;cursor:pointer;font-size:15.5px;overflow-wrap:anywhere}
.oq-pts input{margin-top:2px;width:20px;height:20px;accent-color:var(--ok);flex:none}
.oq-pts label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.oq-model{white-space:pre-line;font-size:15.5px;line-height:1.55;border-radius:var(--r-s);padding:12px 14px;background:var(--accent-soft)}
.oq-tag{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 10px}
.step{font:inherit;font-size:16px;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;border:1.5px solid transparent;border-radius:var(--r-m);padding:13px 14px;background:var(--card2);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.step .no{font-size:13px;font-weight:700;color:var(--accent);min-width:22px;padding-top:2px;font-variant-numeric:tabular-nums}
.step.placed{border-color:var(--accent);background:var(--accent-soft)}
.step.right{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.step.wrong{border-color:var(--bad);background:var(--bad-soft);cursor:default}
.step:disabled{cursor:default}
.slot{border:1.5px dashed var(--line-strong);border-radius:var(--r-m);padding:12px 14px;color:var(--muted);font-size:14px}
.clist{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:24px}
.clist li{padding-left:4px;overflow-wrap:anywhere}
.clist li::marker{color:var(--accent);font-weight:600}
.note{font-size:15px;color:var(--muted);background:var(--card2);border-radius:var(--r-s);padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
/* bottom tab bar, floating */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom, 0px));width:min(560px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px;border-radius:32px;background:var(--bar);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 6px 24px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.tabbar button{font:inherit;font-size:11.5px;font-weight:500;color:var(--muted);background:none;border:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:26px;-webkit-tap-highlight-color:transparent;min-width:0;transition:background .15s,color .15s}
.tabbar button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Skills */
.sk{padding:0;gap:0}
.sk summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 20px;min-height:60px}
.sk summary::-webkit-details-marker{display:none}
.sk summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .2s;flex:none}
.sk[open] summary::after{transform:rotate(-135deg)}
.sk-t{font-weight:600;font-size:17px;color:var(--qink);flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.sk-p{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;color:var(--accent);background:var(--accent-soft)}
.sk-p.p3{color:var(--bad);background:var(--bad-soft)}
.sk-p.p2{color:var(--warn);background:var(--warn-soft)}
.sk-ok{color:var(--ok);font-size:13px;font-weight:600}
.sk-b{display:flex;flex-direction:column;gap:10px;padding:0 20px 20px}
.sk-ask{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.sk-ask li{background:var(--card2);border-radius:var(--r-s);padding:10px 12px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.sk-ask li span{color:var(--muted);font-size:15px}
.sk-ask details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
.sk-ru{font-size:15px;color:var(--muted);background:var(--card2);border-radius:var(--r-s);padding:10px 12px}
/* Konspekt (eingebettet) */
.ksp{display:flex;flex-direction:column;gap:var(--gap);font-size:15.5px;line-height:1.5}
.ksp section{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.ksp h2{font-size:20px;margin:0 0 4px}
.ksp h3{color:var(--accent);font-size:16.5px;margin:12px 0 2px}
.ksp p{margin:0 0 4px}
.ksp ul,.ksp ol{margin:0 0 6px;padding-left:22px}
.ksp li{margin:0 0 3px;overflow-wrap:anywhere}
.ksp li::marker{color:var(--accent)}
.ksp b{color:var(--qink);font-weight:650}
.ksp .ru{color:var(--muted);font-size:.86em;font-weight:400;font-style:normal}
.ksp .ru::before{content:"("}.ksp .ru::after{content:")"}
.ksp .rub{display:block;color:var(--muted);font-size:.9em;margin-top:3px}
.ksp .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ksp .cols>div{min-width:0}
@media (max-width:760px){.ksp .cols{grid-template-columns:1fr}}
.ksp .tw{overflow-x:auto;margin:4px 0 8px;border-radius:var(--r-s);border:1px solid var(--line)}
.ksp table{border-collapse:collapse;width:100%;font-size:14px}
.ksp th,.ksp td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.ksp tr:last-child td{border-bottom:0}
.ksp th{background:var(--card2);color:var(--muted);font-weight:600}
.ksp td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.ksp .box{background:var(--card2);border-radius:var(--r-s);padding:12px 14px;margin:4px 0 8px}
.ksp .merk{background:var(--accent-soft)}
.ksp .merk::before{content:"Merke";display:block;font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px}
.ksp .falle{background:var(--bad-soft)}
.ksp .falle::before{content:"Falle";display:block;font-size:12.5px;font-weight:700;color:var(--bad);margin-bottom:4px}
.ksp .check{background:var(--ok-soft)}
.ksp .src,.ksp .small{font-size:13.5px;color:var(--muted)}
.ksp .sub{font-size:15px}
.ksp .toc{display:none}
.ksp .pdfonly{display:none}
.ksp .num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ksp .num-grid div{background:var(--card2);border-radius:var(--r-s);padding:10px 12px}
.ksp .num-grid b{display:block;font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.ksp .num-grid span{font-size:13px;color:var(--ink)}
.ksp .fallen li{margin-bottom:8px}
.ksp .dict{columns:2 260px;column-gap:24px;font-size:14.5px}
.ksp .dict p{break-inside:avoid;margin:0 0 5px}
.ksp .dict .ru::before,.ksp .dict .ru::after{content:""}
.ksp .dict .ru{font-size:.95em}
.knav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;padding:6px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;box-shadow:0 0 0 1px var(--line)}
.knav::-webkit-scrollbar{display:none}
.knav a{flex:none;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;padding:8px 13px;border-radius:999px;white-space:nowrap}
.knav a:hover{background:var(--card2)}
.kk-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kk-sum div{background:var(--card2);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}

<!-- ============ 2 ZELLE ============ -->
<section class="sec" id="k2">
<h2>2 · Terminologie &amp; Zelle</h2>
<div class="cols"><div>
<h3>Lage &amp; Richtung</h3>
<div class="tw"><table>
<tr><th>Begriff</th><th>Bedeutung</th></tr>
<tr><td>cranial / caudal</td><td>schädelwärts / schwanzwärts</td></tr>
<tr><td>ventral / dorsal</td><td>bauchwärts / rückenwärts (anterior / posterior)</td></tr>
<tr><td>proximal / distal</td><td>zum Rumpf hin / vom Rumpf weg</td></tr>
<tr><td>medialis / lateralis</td><td>zur Mitte hin / seitlich</td></tr>
<tr><td>median / medius</td><td>in der Körpermitte / mittlerer (zwischen zwei)</td></tr>
<tr><td>profundus / superficialis</td><td>tief / oberflächlich</td></tr>
<tr><td>dexter / sinister</td><td>rechts / links</td></tr>
<tr><td>ascendens / descendens</td><td>aufsteigend / absteigend</td></tr>
</table></div>
<p><b>Latein:</b> Foramen/Ostium = Loch · Fossa = Grube · Sulcus = Furche · Plexus = Geflecht · Ramus = Zweig · Radix = Wurzel · Glandula = Drüse · Os = Knochen · Cartilago = Knorpel · Septum = Trennwand · Tunica = Hülle · Processus = Fortsatz.</p>
<p><b>Silben:</b> brady- langsam · tachy- schnell · hemi- halb · hetero- ungleich · homo- gleich · peri- um herum · -itis Entzündung · -pathie krankhafte Veränderung · -ose degenerativ.</p>
<p><b>Geschichte:</b> Hippokrates (Vier-Säfte-Lehre) → Galen (sezierte Tiere) → Mondino → Leonardo → <b>Vesalius</b> (erstes Lehrbuch am menschlichen Leichnam).</p>
</div><div>
<h3>Zelle</h3>
<p><b>Zelle</b> = kleinste selbständig lebens- und vermehrungsfähige Einheit. Aufbau: Zelle → Gewebe → Organ → Organsystem → Organismus.</p>
<p><b>Membran:</b> Lipiddoppelschicht + Proteine + Glykokalix; <b>semipermeabel</b>. Frei: lipophile Stoffe, O2/CO2, Alkohol, Steroidhormone. Kanäle: Wasser (Aquaporine), Ionen.</p>
<p><b>Na+ außen, K+ innen</b> → Ruhemembranpotential; gehalten von der <b>Na+-K+-ATPase</b> (ATP).</p>
<p><b>Transport:</b> Diffusion (hoch → niedrig) · Osmose (Lösungsmittel durch semipermeable Membran) · onkotischer Druck = Proteine (Albumin) · Endozytose (Phago = fest, Pino = gelöst) · Exozytose.</p>
<p><b>Tonizität:</b> isoton = NaCl 0,9 % · hypoton → Zelle platzt · hyperton → Zelle schrumpft.</p>
<div class="tw"><table>
<tr><th>Organell</th><th>Aufgabe</th></tr>
<tr><td>Zellkern / Nukleolus</td><td>DNA / rRNA, Ribosomen-Untereinheiten</td></tr>
<tr><td>raues ER</td><td>Proteine (Ribosomen)</td></tr>
<tr><td>glattes ER</td><td>Fette, Steroide, Entgiftung, Ca-Speicher</td></tr>
<tr><td>Golgi</td><td>„Poststelle“ – verpacken, Vesikel</td></tr>
<tr><td>Lysosom</td><td>„Magen“ – Auto-/Heterophagie</td></tr>
<tr><td>Peroxisom</td><td>Entgiftung, freie Radikale</td></tr>
<tr><td>Mitochondrium</td><td>„Kraftwerk“ – ATP, Wärme</td></tr>
</table></div>
<p><b>DNA:</b> A–T, C–G · Transkription DNA → mRNA · Translation mRNA → Protein · 46 Chromosomen (22 Autosomenpaare + XX/XY) · Chromatin = Arbeitsform, Chromosom = Transportform.</p>
<p><b>Mitose:</b> 1 → 2 identische, diploid (46). <b>Meiose:</b> Keimzellen, Crossing over, 1 → 4 haploid (23). Trisomie 21 = numerische Mutation.</p>
</div></div>
</section>

<!-- ============ 3 GEWEBE ============ -->
<section class="sec" id="k3">
<h2>3 · Gewebe</h2>
<div class="cols"><div>
<p><b>4 Grundgewebe:</b> Epithel · Binde-/Stützgewebe · Muskel · Nerv. Parenchym = organspezifisches Gewebe, Stroma = Bindegewebsgerüst.</p>
<h3>Epithel</h3>
<p>Aufgaben: Schutz, Sekretion, Resorption, Reizaufnahme. Sitzt auf der <b>Basalmembran</b>. Formen platt/kubisch/zylindrisch; einschichtig/mehrschichtig/<b>mehrreihig</b> (alle an der Basalmembran).</p>
<p><b>Zellkontakte:</b> Tight Junctions (dicht, Darmbarriere) · Desmosomen (Druckknöpfe) · Gap Junctions (Tunnel).</p>
<p>Atemwege: mehrreihiges Flimmerepithel · Harntrakt: Urothel · Haut: mehrschichtig verhornt.</p>
<p><b>Drüsen:</b> exokrin (Ausführungsgang) vs. endokrin (Hormone ins Blut). Mukös = zäh, serös = dünn. Holokrin = Talgdrüse, apokrin = Schweißdrüse, merokrin = Speicheldrüse.</p>
<h3>Binde- &amp; Stützgewebe</h3>
<p>Wenige Zellen (fix/frei) + viel Interzellularsubstanz (Fasern + Grundsubstanz).</p>
<ul>
<li><b>Kollagen:</b> reißfest, max. 5 % dehnbar (Sehnen) · <b>elastisch:</b> &gt; 100 % (Bänder, Aorta) · <b>retikulär:</b> Netze (lymphatische Organe)</li>
<li>Lockeres BG: überall, Füll-/Verschiebeschicht · straffes BG: Sehnen, Bänder, Kapseln, Herzklappen</li>
<li>Fett: weiß = Isolation, Speicher, Baufett · <b>braun = Wärme beim Säugling</b></li>
<li><b>Knorpel:</b> keine Gefäße, Diffusion, schlechte Regeneration. Hyalin: Gelenke, Rippen, Trachea · elastisch: Kehldeckel, Ohr · Faser: Bandscheiben, Meniskus</li>
<li><b>Knochen:</b> 99 % des Kalziums · Osteoblasten (Aufbau, durch Belastung) / Osteoklasten · Periost: Nerven, Gefäße, Sehnenansatz · desmal: Schädel, Schlüsselbein; chondral: Rest</li>
</ul>
</div><div>
<h3>Muskel</h3>
<p>Sarkomer (kleinste Einheit) → Myofibrille → Muskelfaser. <b>Kontraktion:</b> AP → Ca2+ aus SR → bindet <b>Troponin</b> → Aktin/Myosin gleiten unter <b>ATP</b>.</p>
<div class="tw"><table>
<tr><th></th><th>Skelett</th><th>Herz</th><th>glatt</th></tr>
<tr><td>Steuerung</td><td>willkürlich</td><td>unwillkürlich</td><td>unwillkürlich</td></tr>
<tr><td>Ermüdung</td><td>ermüdbar</td><td>unermüdbar</td><td>unermüdbar</td></tr>
<tr><td>Besonders</td><td>trainierbar, Agonist/Antagonist</td><td>Glanzstreifen, rhythmisch</td><td>langsam, Koliken</td></tr>
</table></div>
<h3>Nervengewebe</h3>
<p>Dendriten empfangen → Soma → <b>Axonhügel</b> (AP-Auslösung) → Axon (bis 1,5 m) → Synapse. <b>Neurone teilen sich nicht mehr.</b> Multipolar = 99 %. Sensorisch = afferent, motorisch = efferent.</p>
<p><b>Glia:</b> Astrozyten (Blut-Hirn-Schranke, Nährstoffe) · Oligodendrozyten (Myelin ZNS) · Mikroglia (Phagozytose) · Schwann-Zellen (Myelin PNS).</p>
<p><b>Myelin</b> → saltatorisch, bis <b>20×</b> schneller. Geschwindigkeit: Axondurchmesser, Myelin ja/nein, Myelindicke. ENG: Myelinschaden → langsamer; Axonschaden (Diabetes) → Amplitude ↓.</p>
<p><b>Motorische Endplatte:</b> Acetylcholin. Motorische Einheit: groß (50:1) = Kraft, klein (5:1, 1:1) = Präzision.</p>
</div></div>
</section>

<!-- ============ 4 HERZ ============ -->
<section class="sec" id="k4">
<h2>4 · Herz</h2>
<div class="cols"><div>
<p>Im <b>Mediastinum</b>, 250–400 g. Basis oben (Gefäße), Spitze links unten. Achse: rechts-oben-hinten → links-unten-vorne → rechtes Herz liegt vorne.</p>
<p><b>Systole</b> = Anspannung + Austreibung · <b>Diastole</b> = Entspannung + Füllung.</p>
<div class="tw"><table>
<tr><th>Klappe</th><th>Lage</th><th>Typ</th></tr>
<tr><td>Trikuspidal (3)</td><td>re. Vorhof → re. Kammer</td><td>Segel (AV)</td></tr>
<tr><td>Mitral (2)</td><td>li. Vorhof → li. Kammer</td><td>Segel (AV)</td></tr>
<tr><td>Pulmonal</td><td>re. Kammer → Truncus pulmonalis</td><td>Tasche</td></tr>
<tr><td>Aorten</td><td>li. Kammer → Aorta</td><td>Tasche</td></tr>
</table></div>
<p>Segelklappen: Chordae tendineae + Papillarmuskeln. Taschenklappen: 3 Taschen, „Mercedesstern“. <b>Stenose</b> = eng, <b>Insuffizienz</b> = schließt nicht.</p>
<p><b>Herztöne:</b> 1. = Anspannung Kammer · 2. = Schluss Taschenklappen. Systolikum zwischen 1. und 2.</p>
<p><b>Wand:</b> Endokard (Klappen) – Myokard (Glanzstreifen) – Epikard = inneres Perikardblatt. Perikard senkt Reibung, unten mit Zwerchfell verwachsen.</p>
<p><b>Koronarien</b> aus der Aortenwurzel, Füllung in der <b>Diastole</b>. Vorderwandinfarkt: LCA/LAD · Hinterwand: RCA oder R. circumflexus. Herzvenen → Sinus coronarius → re. Vorhof.</p>
<p><b>HF:</b> Erw. 60–80 · Kind 80–100 · Kleinkind 100–120 · Säugling 120–140. Tachy &gt; 100, Brady &lt; 60.</p>
</div><div>
<h3>Erregung</h3>
<p>Herz ist <b>autonom</b>; spezialisierte Herzmuskelzellen (keine Nerven). Sinusknoten (60–80) → AV-Knoten (30–50, verzögert) → His (20) → Tawara → Purkinje. „Alles oder nichts“.</p>
<p><b>AP:</b> −70 mV → Schwelle → Na+ ein, bis +30 (Depolarisation) → K+ aus (Repolarisation) → Hyperpolarisation → Refraktärzeit (Herz ca. 380 ms, plus Ca2+).</p>
<p><b>EKG:</b> elektrische Aktivität – Lage, Frequenz, Rhythmus, Ursprung, Ausbreitung, Rückbildung, Elektrolyte, Digitalis. <b>Kaum Aussage über Pumpleistung.</b> 12-Kanal = Standard; Ruhe-, Belastungs-, 24-h-EKG.</p>
<div class="tw"><table>
<tr><th>Störung</th><th>Merkmal</th></tr>
<tr><td>Vorhofflattern</td><td>kreisend 200–300/min, 2:1–3:1 übergeleitet</td></tr>
<tr><td>Vorhofflimmern</td><td>chaotisch &gt; 300/min, häufigste, Schlaganfall</td></tr>
<tr><td>SVT</td><td>oberhalb der Kammern, Herzrasen</td></tr>
<tr><td>Kammerflattern (VT)</td><td>&gt; 300/min, Notfall, keine Füllung</td></tr>
<tr><td>Kammerflimmern</td><td>&gt; 400/min, kein Auswurf → Defi</td></tr>
</table></div>
<p><b>HZV</b> = SV × HF ≈ 70 ml × 70 = 5 l/min (Belastung bis 20 l). Aufgabe: 80 × 75 = <b>6 l/min</b>.</p>
<p><b>Frank-Starling:</b> mehr Füllung → Vordehnung → stärkere Kontraktion. Vorlast = Füllung, Nachlast = Widerstand.</p>
<p><b>Sympathikus</b> (Noradrenalin, ganzes Herz): HF, Kraft, Leitung ↑ · <b>Parasympathikus</b> (N. vagus, ACh, nur Vorhofebene): HF ↓.</p>
<p>Echo: TTE von außen · TEE = Schluckecho.</p>
</div></div>
</section>

<!-- ============ 5 KREISLAUF ============ -->
<section class="sec" id="k5">
<h2>5 · Kreislauf &amp; Gefäße</h2>
<div class="cols"><div>
<p><b>Lungenkreislauf:</b> re. Herz → A. pulmonalis (O2-arm) → Lunge → 4 Vv. pulmonales (O2-reich) → li. Vorhof. <b>Körperkreislauf:</b> li. Herz → Aorta → Organe → Venen → Hohlvenen → re. Vorhof.</p>
<div class="box merk"><b>Arterie = vom Herzen weg, Vene = zum Herzen hin</b> – nicht der O2-Gehalt entscheidet.</div>
<p><b>Wand:</b> Intima (Endothel) – Media (glatte Muskeln) – Adventitia. Herznah elastisch (<b>Windkessel</b>), herzfern muskulär (<b>Widerstand</b>, Sympathikus). Vasa vasorum versorgen große Gefäßwände.</p>
<p><b>Venen:</b> dünne Media, Klappen, <b>Kapazitätsgefäße</b> (60–70 % des Blutes). Rückstrom: Klappen, Muskelpumpe, Pulswelle, Herzsog, Atmung. Insuffizienz → Rückfluss, Stau.</p>
<p><b>Kapillare:</b> Endothel + Basalmembran + Perizyten. Arteriell hydrostatischer Druck ↑ (raus), venös onkotischer Druck (Albumin) ↑ (rein).</p>
<p>Lokal erweiternd: O2-Mangel, CO2, Laktat, NO, Histamin. Verengend: Serotonin, Thromboxan.</p>
</div><div>
<h3>Wichtige Gefäße</h3>
<ul>
<li>Aorta ascendens → Arcus → descendens (thoracica, abdominalis)</li>
<li>Rechts: <b>Truncus brachiocephalicus</b> → A. carotis communis dextra + A. subclavia dextra · links direkt</li>
<li>Karotisgabel Höhe <b>4. HWK</b> (interna/externa); A. vertebralis aus subclavia</li>
<li>Arm: subclavia → axillaris → brachialis → radialis/ulnaris</li>
<li>Bein: iliaca communis → externa → femoralis → poplitea → tibialis</li>
<li>A. mesenterica sup.: Dünndarm + Dickdarm bis li. Flexur · inf.: ab li. Flexur</li>
<li>Armvenen oberflächlich: cephalica, basilica, mediana cubiti</li>
<li><b>Pfortader:</b> Darm/Milz/Magen → Leber. V. rectalis media/inferior umgehen die Leber (Zäpfchen!). Portale Hypertension → Aszites, Ösophagusvarizen, Caput medusae, Hämorrhoiden.</li>
</ul>
<h3>Blutdruck</h3>
<p>RR = Herztätigkeit × Widerstand + Volumen. Riva-Rocci: richtige Manschette, Herzhöhe, 5 min Ruhe, gleicher Arm; Korotkoff-Geräusche; normal 120/80.</p>
<p><b>Niederdruck</b> (0–15 mmHg, 85 % Blut): Kapillaren, Venen, re. Herz, Lunge, li. Vorhof · <b>Hochdruck</b> (70–120): li. Kammer, Arterien.</p>
<p><b>ZVD</b> 8–12 cm H2O: &lt; 5 Schock · &gt; 12 Rechtsherzinsuffizienz, Lungenembolie.</p>
<p>Kreislaufzentrum Medulla oblongata. Kurzfristig: Barorezeptoren (Karotisgabel, Aortenbogen) → VNS. Langfristig: RAAS, ADH, ANP. <b>Bayliss:</b> Druck ↑ → Arteriolen eng.</p>
</div></div>
</section>

<!-- ============ 6 BLUT ============ -->
<section class="sec" id="k6">
<h2>6 · Blut &amp; Immunsystem</h2>
<div class="cols"><div>
<p>7 % KG · Aufgaben: Transport, Abwehr, Gerinnung, Wärme, Puffer. 45 % Zellen (99 % Ery) = <b>Hämatokrit</b> · 55 % Plasma (90 % Wasser, 8 % Proteine: 60 % Albumin, 40 % Globuline). <b>Serum</b> = Plasma ohne Fibrinogen.</p>
<p>Bildung im <b>roten Knochenmark</b> (platte/kurze Knochen, gelenknahe Enden) aus pluripotenten Stammzellen.</p>
<p><b>Erythrozyt:</b> bikonkav, kernlos, 120 Tage, Abbau Milz/Leber. Hb braucht Eisen, Folsäure, B12. Fe bindet O2, Globin CO2. CO2: 70 % Bikarbonat (Carboanhydrase), 20 % an Hb, 10 % gelöst.</p>
<p>Hb-Abbau: Eisen → Transferrin → Ferritin (95 % recycelt) · Häm → Bilirubin (Galle grün) → Sterkobilin (Stuhl braun) / Urobilin (Urin gelb).</p>
<p>Formen: B12-Mangel groß · Eisenmangel klein · hypoton Kugel · hyperton Stechapfel. <b>Anämie</b>: Müdigkeit, Blässe, Kurzatmigkeit.</p>
<p><b>Blutgruppen:</b> ABO-Antikörper natürlich, <b>nicht plazentagängig</b>. 0 = Universalspender Ery, AB = Universalempfänger Ery. Rh+ 85 %, Antigen D, dominant; Antikörper erst nach Kontakt, <b>plazentagängig</b> → Anti-D-Prophylaxe. Bedside-Test vor jeder Transfusion.</p>
</div><div>
<p><b>Hämostase primär:</b> Vasokonstriktion → Adhäsion → Aggregation → weißer Thrombus. <b>Sekundär:</b> 13 Faktoren → Thrombin → Fibrinogen → Fibrin → roter Thrombus → Retraktion. <b>Fibrinolyse:</b> Plasmin. Hemmer: Antithrombin III, Heparin. <b>Vitamin K</b> → Gerinnungsfaktoren (Leber).</p>
<div class="tw"><table>
<tr><th>Zelle</th><th>Merkmal</th></tr>
<tr><td>Neutrophile (50–70 %)</td><td>Bakterien, Eiter, stab-/segmentkernig</td></tr>
<tr><td>Eosinophile</td><td>Parasiten, Allergie</td></tr>
<tr><td>Basophile / Mastzellen</td><td>Histamin, Heparin, Allergie</td></tr>
<tr><td>Monozyt → Makrophage</td><td>stärkste Phagozytose, Antigenpräsentation</td></tr>
<tr><td>B-Lymphozyt</td><td>Knochenmark, Antikörper (Plasmazelle)</td></tr>
<tr><td>T-Lymphozyt</td><td>Thymus; TH, Treg, Tc</td></tr>
<tr><td>NK-Zelle</td><td>angeboren, Virus-/Tumorzellen</td></tr>
<tr><td>Dendritische Zelle</td><td>Gewebe, wandert in LK, präsentiert</td></tr>
</table></div>
<p><b>Angeboren:</b> Granulozyten, Makrophagen, NK, Mastzellen, dendritische Zellen, Komplement · <b>Erworben:</b> B, T, Antikörper, Gedächtniszellen. Humoral = Antikörper, zellulär = T-Zellen.</p>
<p>Diapedese = Durchwandern, Chemotaxis = Anlocken. <b>Linksverschiebung</b> = viele unreife Neutrophile (bakteriell) · Lymphozytose eher viral.</p>
<p><b>Darmbarriere</b> (400–500 m²): Mikrobiom · Schleimhaut (Tight Junctions, Mucus, Defensine, sIgA) · Immunzellen (GALT). Leaky Gut = undicht.</p>
</div></div>
</section>

<!-- ============ 7 LYMPHE ============ -->
<section class="sec" id="k7">
<h2>7 · Lymphatisches System</h2>
<div class="cols"><div>
<p><b>Primär:</b> Knochenmark (B), Thymus (T) · <b>Sekundär:</b> Milz, Lymphknoten, MALT. Nur 2 % der Lymphozyten im Blut.</p>
<p><b>Thymus:</b> hinter dem Brustbein vor der Herzbasis, 2 Lappen, Rinde + Mark. Ab Pubertät <b>Involution</b> → Fett; Reste bleiben aktiv.</p>
<p><b>Lymphe:</b> venöse Kapillaren 90 %, Lymphkapillaren 10 %. Keine Lymphgefäße in ZNS, Knochenmark, Knochen, Knorpel.</p>
<p>Untere Körperhälfte + Darm → <b>Cisterna chyli</b> → <b>Ductus thoracicus</b> (Milchbrustgang) → <b>linker Venenwinkel</b> (+ li. Kopf/Hals, li. Arm). Rechter Arm + re. Kopf/Hals → rechter Venenwinkel.</p>
<p>Lymphfluss: Wandkontraktion + Skelettmuskulatur + Klappen → Bewegung wichtig.</p>
</div><div>
<p><b>Lymphknoten</b> (0,3–1 cm): Filter, Kontrollstation. Vasa afferentia → Randsinus → Intermediärsinus → Marksinus → Vas efferens. Kortikal = B (Follikel), parakortikal = T. Regionen: cervical, axillär, inguinal.</p>
<p><b>Milz:</b> links unter dem Zwerchfell, 10. Rippe, <b>intraperitoneal</b>, größtes lymphatisches Organ, 20–30 % der Lymphozyten. Rote Pulpa = Ery-Abbau; weiße Pulpa = PALS (T) + Malpighi-Körperchen (B). A./V. splenica.</p>
<div class="box merk">Lymphknoten filtern die <b>Lymphe</b> – die Milz kontrolliert das <b>Blut</b>.</div>
<p><b>MALT:</b> Waldeyer-Rachenring (Rachen-, Gaumen-, Zungenmandel), Peyer-Plaques (Ileum, M-Zellen), Appendix.</p>
</div></div>
</section>

<!-- ============ 8 ATMUNG ============ -->
<section class="sec" id="k8">
<h2>8 · Atmungssystem</h2>
<div class="cols"><div>
<p><b>Obere</b> Luftwege: Nase, NNH, Rachen · <b>untere</b>: Kehlkopf, Trachea, Bronchien, Bronchiolen · Gasaustausch: Alveolen. Äußere Atmung = Lunge, innere = Mitochondrien.</p>
<p><b>AF:</b> Erw. 12–15 · Jugendl. 16–19 · Kind 20 · Säugling 30–50.</p>
<p>Flimmerepithel: Zilien schlagen Richtung Rachen (1–1,5 cm/min), Schleim aus Becherzellen.</p>
<p><b>Nase:</b> Geruch, Reinigung, Erwärmung, Anfeuchtung; 3 Muscheln. NNH: Stirn-, Kiefer-, Keilbeinhöhle, Siebbeinzellen (Gewicht ↓, Resonanz). Tuba auditiva → Druckausgleich.</p>
<p><b>Pharynx</b> 12–15 cm: Naso- (nur Luft, Tuba, Rachenmandel) – Oro- (Luft + Speise) – Laryngopharynx.</p>
<p><b>Larynx:</b> Kehldeckel verschließt beim Schlucken. Husten: zu → auf · Niesen: offen. N. laryngeus recurrens: einseitig Heiserkeit, beidseitig Atemnot. Laryngospasmus → Koniotomie (Notfall) vs. Tracheotomie (geplant).</p>
<p><b>Trachea:</b> 10–15 cm, 15–20 Hufeisenspangen, Bifurkation 4. BWK, rechts steiler → Aspiration. Bronchiolen ohne Knorpel.</p>
<p><b>Lunge:</b> re 3 Lappen/10 Segmente · li 2 Lappen/9 Segmente (10–20 % kleiner). Surfactant senkt Oberflächenspannung. Pleura visceralis (Lunge) / parietalis (Rippen), Spalt mit Unterdruck.</p>
</div><div>
<p><b>Einatmung aktiv:</b> Zwerchfell (N. phrenicus) + äußere Zwischenrippenmuskeln. <b>Ausatmung passiv</b> (Elastizität), ggf. innere Interkostal- + Bauchmuskeln.</p>
<p><b>Totraum</b> ca. 150 ml (anatomisch; alveolär = pathologisch). Alveoläre Ventilation = 500 − 150 = 350 ml → <b>tief und langsam</b> atmen.</p>
<div class="tw"><table>
<tr><th>Volumen</th><th>Definition</th></tr>
<tr><td>AZV</td><td>normale Atmung (~500 ml)</td></tr>
<tr><td>IRV / ERV</td><td>max. zusätzlich ein / aus</td></tr>
<tr><td>RV</td><td>bleibt nach max. Ausatmung</td></tr>
<tr><td>VK</td><td>AZV + IRV + ERV</td></tr>
<tr><td>TK</td><td>VK + RV</td></tr>
<tr><td>FRC</td><td>ERV + RV</td></tr>
<tr><td>AMV</td><td>AZV × AF</td></tr>
</table></div>
<p><b>Obstruktiv</b> (COPD, Asthma): Bronchien eng, FEV1 ↓, RV ↑, Ausatmen schwer · <b>restriktiv</b> (Fibrose, Pneumonie, Ödem, Thoraxdeformität): Compliance ↓, VK ↓, Einatmen schwer.</p>
<p>Spirometrie (klein): VK, FEV1, <b>Tiffeneau</b> FEV1/VK &gt; 75 % · Bodyplethysmografie (groß): Resistance, RV.</p>
<p>Diffusion durch Partialdruckunterschied. A. pulmonalis 25/8 mmHg. SpO2 94–98 % (Fehler: Nagellack, Kälte/Schock, CO).</p>
<p><b>Steuerung:</b> Atemzentrum Medulla oblongata; stärkster Reiz <b>pCO2 ↑</b>; Hering-Breuer-Reflex (N. vagus). COPD: Gewöhnung an CO2 → O2-Mangel als Antrieb.</p>
</div></div>
</section>

<!-- ============ 9 NIERE ============ -->
<section class="sec" id="k9">
<h2>9 · Niere, Harnwege, Wasser- &amp; Säure-Basen-Haushalt</h2>
<div class="cols"><div>
<p><b>Niere:</b> retroperitoneal, 12 cm, Fettkapsel. Aufgaben: Ausscheidung, Wasser/Elektrolyte, Säure-Basen, Hormone (<b>Renin, Erythropoetin, Vit. D3</b>). 20–25 % des HZV.</p>
<p>Rinde (Nierenkörperchen) · Mark (Pyramiden, Tubuli) · Papille → Kelch → Becken → Ureter. Lobus = Pyramide + Rinde.</p>
<p><b>Nephron</b> (1–1,5 Mio): Glomerulus + Bowman-Kapsel + Tubulus. Filter: Endothel, Basalmembran, Podozyten → Primärharn eiweißfrei. Mesangium reinigt. <b>Juxtaglomerulärer Apparat</b>: misst Na+, bildet Renin.</p>
<p>180 l Primärharn → 99 % rückresorbiert → <b>1,5 l Endharn</b> (95 % Wasser + Harnstoff, Harnsäure, Kreatinin). Glukose/AS vollständig zurück.</p>
<p><b>Aldosteron:</b> Na+ ↑ (Wasser folgt) · <b>ADH:</b> Wasser ↑ · <b>ANP:</b> Gegenspieler (Vorhofdehnung).</p>
<p><b>RAAS:</b> Macula densa (NaCl ↓) → Renin → Angiotensin I → II → Vasokonstriktion + Aldosteron → RR ↑.</p>
<p><b>GFR</b> = Primärharn/min, Frauen ~10 % niedriger. Filtrationsdruck: Kapillardruck, onkotischer Druck, Kapseldruck; Autoregulation bis syst. &gt; 80 mmHg.</p>
</div><div>
<p><b>Ureter</b> 30 cm, 3 Engen, schräger Ventilmechanismus. <b>Blase</b> 900–1500 ml (Drang Frau 250–550, Mann 350–750), Trigonum, Detrusor. Sympathikus = Kontinenz, Parasympathikus = Miktion; Sphincter externus + Beckenboden willkürlich. Harnröhre Mann länger.</p>
<p><b>Beckenboden:</b> innen Diaphragma pelvis (Levator ani, Stuhl) · Mitte Diaphragma urogenitale (Harnkontinenz) · außen Schließ-/Schwellkörpermuskeln.</p>
<p><b>Harnstreifen:</b> Eiweiß → Nierenentzündung · Glukose → Diabetes · Ery → HWI, Tumor · Leuko + <b>Nitrit</b> → bakterielle HWI.</p>
<p>Dialyse: Hämodialyse (Zentrum) · Peritonealdialyse (zuhause, Bauchfell).</p>
<p><b>Wasser:</b> 60 % (2/3 intra, 1/3 extra). Extra Na+, intra K+. Niere steuert nur den Extrazellulärraum.</p>
<p><b>pH 7,4 (7,37–7,45):</b> Azidose &lt; 7,37, Alkalose &gt; 7,45. <b>Bicarbonat-Puffer</b>: Lunge → CO2 (Minuten), Niere → HCO3−/H+ (Stunden). Respiratorisch (Asthma, Hyperventilation → Alkalose) vs. metabolisch (Diabetes, Erbrechen, Durchfall).</p>
</div></div>
</section>

<!-- ============ 10 GENITAL ============ -->
<section class="sec" id="k10">
<h2>10 · Geschlechtsorgane</h2>
<div class="cols"><div>
<p>Biologisches Geschlecht: Chromosomen, Keimdrüsen, Hormone, Geschlechtsmerkmale.</p>
<p><b>Vulva:</b> Schamhügel, Schamlippen, Klitoris, Scheidenvorhof. <b>Innen:</b> Vagina (Döderlein → Milchsäure, saurer pH), Uterus, Ovar, Eileiter.</p>
<p><b>Uterus</b> nach vorne geneigt. Bänder: Lig. latum (A./V. uterina), Lig. teres (Leistenkanal → Schamlippe), Lig. cardinale (Zervix → Beckenwand; Senkung/Prolaps).</p>
<p>Portio (äußerer MM) – Cervix – Isthmus (innerer MM) – Corpus – Fundus. Wand: Endometrium (Funktionalis abgestoßen / Basalis bleibt) – Myometrium – Perimetrium.</p>
<p><b>Zyklus</b> 28 Tage (21–35): Follikel (Östrogen) → Eisprung (<b>LH</b>) → Gelbkörper (<b>Progesteron</b>). Endometrium: Menstruation – Proliferation – Sekretion – Ischämie. Menarche 12–15, Menopause ~55, davor Klimakterium.</p>
<p>Eileiter: Fimbrien fangen das Ei, Transport durch Flimmerepithel, <b>Befruchtung im Eileiter</b>. Schutz: Laktobazillen + Zervixschleim.</p>
<p>Brust: 10–20 Einzeldrüsen.</p>
</div><div>
<p><b>Außen:</b> Penis, Harnsamenröhre, Skrotum · <b>Innen:</b> Hoden, Nebenhoden, Samenleiter, Prostata, Bläschendrüse, Cowper-Drüse.</p>
<p>Penis: Corpus cavernosum + Corpus spongiosum; Erektion = Parasympathikus.</p>
<p><b>Descensus testis</b> durch den Leistenkanal (5 % Hodenhochstand). Skrotum 2–4 °C kühler. M. cremaster reguliert Abstand. Leistenkanal: Mann Samenstrang, Frau Lig. teres uteri.</p>
<p><b>Hoden:</b> Keimzellen (72 Tage), Sertoli (Inhibin), <b>Leydig (Testosteron)</b>. Nebenhoden: Reifung 10–14 Tage + Speicher (Gang 5–6 m).</p>
<p>Bläschendrüse 70 % (Fruktose, alkalisch) · Prostata 30 % (PSA, Spermin), unter der Blase um die Harnröhre, vor dem Rektum · Cowper: Gleitfähigkeit.</p>
<p>Samenleiter: Nebenhoden → Leistenkanal → Prostata; ab Bläschendrüse = Ductus ejaculatorius. Vasektomie = Durchtrennung.</p>
</div></div>
</section>

<!-- ============ 11 MERK & FALLEN ============ -->
<section class="sec" id="k11">
<h2>11 · Merkhilfen &amp; Fallen</h2>
<div class="cols fallen"><div>
<h3>Merkhilfen</h3>
<ul>
<li><b>B wie Bone marrow, T wie Thymus.</b></li>
<li><b>„Tri“ rechts, „Mitra“ links</b> – der Bischof (Mitra) trägt seine Mütze links.</li>
<li><b>Sinus 60–80 · AV 30–50 · His 20</b> – jede Stufe ca. halbiert.</li>
<li><b>HZV = SV × HF</b>, „70 × 70 ≈ 5 l“.</li>
<li><b>Lungen:</b> „rechts 3 / 10, links 2 / 9“ – links fehlt Platz fürs Herz.</li>
<li><b>Oligo oben (ZNS), Schwann unten (PNS).</b></li>
<li><b>Hydrostatisch raus, onkotisch rein.</b></li>
<li><b>Sympathikus hält (Blase), Parasympathikus lässt laufen.</b></li>
<li><b>„Leydig macht Lust“</b> (Testosteron).</li>
<li><b>Funktionalis fällt, Basalis bleibt.</b></li>
<li><b>ADH = Anti-Diurese</b> → weniger Harn.</li>
<li><b>Lymphknoten = Lymphe · Milz = Blut.</b></li>
</ul>
</div><div>
<h3>Fallen &amp; Widersprüche</h3>
<ol>
<li><b>Verneinte Fragen</b> (NICHT / FALSCH) – Signalwort zuerst.</li>
<li><b>Sinusknoten-Frequenz:</b> Maas-Folie 60–80/min · Begleitskript Steinwender „etwa 100× pro Minute“ (ohne vegetative Einflüsse). Im Test meist 60–80 (Folie).</li>
<li><b>A. mesenterica inferior:</b> VO-Wiederholung schreibt „Dünndarm ab linker Colonflexur“ – richtig laut Maas: <b>Dickdarm</b> ab linker Flexur.</li>
<li><b>Obere/untere Atemwege:</b> Folie: Kehlkopf = unten · Begleitskript: Grenze = Stimmlippe.</li>
<li><b>Herzfrequenz Erwachsene:</b> Normwert 60–80, aber Tachy erst &gt; 100.</li>
<li><b>Bifurkation 4. BWK</b> (Trachea) vs. <b>Karotisgabel 4. HWK</b>.</li>
<li><b>Arterien ≠ O2-reich:</b> A. pulmonalis führt O2-armes Blut.</li>
<li><b>Milz intraperitoneal</b>, Niere/Ureter retroperitoneal, Blase subperitoneal.</li>
<li><b>ABO-Antikörper</b> nicht plazentagängig, <b>Rh-Antikörper</b> schon.</li>
<li><b>EKG</b> zeigt nicht die Pumpleistung.</li>
<li><b>Thymus</b> nach Involution nicht komplett inaktiv.</li>
<li><b>MC-Taktik:</b> Teilpunkt-Abzug pro falschem Kreuz – nur sichere Antworten ankreuzen.</li>
</ol>
</div></div>
</section>

 {id:"c_mem",t:1,title:"Zellmembran",src:"Die Zelle (Maas)",t2:"Die Zellmembran ist eine [Lipiddoppelschicht] mit eingelagerten Proteinen. Sie ist [semipermeabel]. Gase und [lipophile] Stoffe treten frei durch, Wasser und Ionen brauchen [Kanäle]. Extrazellulär ist [Natrium] hoch, intrazellulär [Kalium].",extra:["hydrophile","Glukose","Calcium"]},
 {id:"c_osm",t:1,title:"Osmose & Tonizität",src:"Die Zelle (Maas)",t2:"Bei der [Osmose] wandert das Lösungsmittel durch eine semipermeable Membran. In einer [hypotonen] Lösung schwellen Zellen an, in einer [hypertonen] schrumpfen sie. Physiologische Kochsalzlösung ist [isoton]. Den onkotischen Druck erzeugen v. a. [Proteine].",extra:["Diffusion","Ionen"]},
 {id:"c_org",t:1,title:"Organellen",src:"Die Zelle (Maas)",t2:"Die [Mitochondrien] liefern ATP. Das [raue] ER trägt Ribosomen und bildet Proteine. Der [Golgi-Apparat] verpackt sie in Vesikel. [Lysosomen] bauen Stoffe ab, [Peroxisomen] entgiften.",extra:["glatte","Nukleolus"]},
 {id:"c_mit",t:1,title:"Mitose & Meiose",src:"Die Zelle (Maas)",t2:"Bei der [Mitose] entstehen aus einer Zelle zwei identische Tochterzellen mit [46] Chromosomen. Bei der [Meiose] entstehen vier Zellen mit [23] Chromosomen. Dabei kommt es zum [Crossing over].",extra:["92","Transkription"]},
 {id:"c_epi",t:2,title:"Epithel",src:"Gewebe (Maas)",t2:"Epithelzellen sitzen auf einer [Basalmembran]. [Tight Junctions] dichten den Zwischenraum ab, [Gap Junctions] bilden Tunnel. [Exokrine] Drüsen haben einen Ausführungsgang, [endokrine] geben Hormone ins Blut ab.",extra:["Desmosomen","Myelinscheide"]},
 {id:"c_knorp",t:2,title:"Knorpel & Knochen",src:"Gewebe (Maas)",t2:"Knorpel hat keine [Blutgefäße] und wird durch [Diffusion] ernährt. Bandscheiben bestehen aus [Faserknorpel], der Kehldeckel aus [elastischem] Knorpel. [99] % des Kalziums liegen im Knochen.",extra:["hyalinem","Nerven","50"]},
 {id:"c_nerv",t:2,title:"Neuron",src:"Gewebe (Maas)",t2:"[Dendriten] empfangen den Impuls, das [Axon] leitet ihn weiter. Die Myelinscheide wird im ZNS von [Oligodendrozyten] und im PNS von [Schwann-Zellen] gebildet. An den [Ranvier]-Schnürringen springt die Erregung.",extra:["Mikroglia","Astrozyten"]},
 {id:"c_herz",t:3,title:"Herzklappen",src:"Herz (Maas)",t2:"Zwischen rechtem Vorhof und rechter Kammer liegt die [Trikuspidalklappe], links die [Mitralklappe]. Beide sind [Segelklappen] und über Sehnenfäden an [Papillarmuskeln] befestigt. Aorten- und Pulmonalklappe sind [Taschenklappen].",extra:["Glanzstreifen","Septum"]},
 {id:"c_erreg",t:3,title:"Erregungsleitung",src:"Herz (Maas)",t2:"Der [Sinusknoten] ist der Schrittmacher mit 60–80/min. Der [AV-Knoten] verzögert die Überleitung. Danach folgen [His-Bündel], [Tawara-Schenkel] und [Purkinje-Fasern]. Das vegetative Nervensystem [moduliert] nur.",extra:["erzeugt","Synapse"]},
 {id:"c_hzv",t:3,title:"Herzleistung",src:"Herz (Maas)",t2:"Das Herzzeitvolumen ist [Schlagvolumen] × [Herzfrequenz]. In Ruhe: 70 ml × 70/min ≈ [5] l/min. Nach dem [Frank-Starling]-Mechanismus führt mehr Füllung zu stärkerer Kontraktion. Der [Sympathikus] steigert Frequenz und Kraft.",extra:["Parasympathikus","10","Blutdruck"]},
 {id:"c_gef",t:4,title:"Gefäße",src:"Herz, Kreislauf (Maas)",t2:"Arterien führen [vom Herzen weg]. Die Aorta wirkt als [Windkessel]. [Arteriolen] sind Widerstandsgefäße. Venen sind [Kapazitätsgefäße] und enthalten 60–70 % des Blutes. [Venenklappen] verhindern den Rückfluss.",extra:["zum Herzen hin","Kapillaren"]},
 {id:"c_kap",t:4,title:"Kapillaraustausch",src:"Herz, Kreislauf (Maas)",t2:"Am arteriellen Ende überwiegt der [hydrostatische] Druck und presst Flüssigkeit ins Gewebe. Am venösen Ende überwiegt der [onkotische] Druck, erzeugt durch [Albumin]. Etwa 10 % der Flüssigkeit fließen über die [Lymphe] ab.",extra:["Natrium","osmotische Diurese"]},
 {id:"c_blut",t:5,title:"Blut",src:"Blut (Maas)",t2:"Blut macht ca. [7] % des Körpergewichts aus. Davon sind 45 % Zellen, der Anteil heißt [Hämatokrit]. Plasma ohne Fibrinogen heißt [Serum]. Erythrozyten leben ca. [120] Tage, Thrombozyten ca. [8–10] Tage.",extra:["15","Lymphe","30"]},
 {id:"c_ger",t:5,title:"Gerinnung",src:"Blut (Maas)",t2:"Zuerst zieht sich das Gefäß zusammen ([Vasokonstriktion]). Thrombozyten bilden den [weißen] Thrombus. In der Gerinnungskaskade entsteht [Thrombin], das Fibrinogen in [Fibrin] umwandelt. [Plasmin] löst das Netz wieder auf.",extra:["roten","Heparin"]},
 {id:"c_imm",t:5,title:"Immunzellen",src:"Blut (Maas)",t2:"[Neutrophile] Granulozyten vermehren sich bei bakteriellen Infekten. [Eosinophile] reagieren auf Parasiten. [B-Lymphozyten] bilden Antikörper und reifen im Knochenmark, T-Lymphozyten reifen im [Thymus]. [NK-Zellen] zerstören virusinfizierte Zellen.",extra:["Basophile","Milz"]},
 {id:"c_lym",t:6,title:"Lymphabfluss",src:"Lymphe (Maas)",t2:"Die Lymphe der unteren Körperhälfte sammelt sich in der [Cisterna chyli] und fließt über den [Ductus thoracicus] in den [linken] Venenwinkel. Der rechte Arm drainiert in den [rechten] Venenwinkel. Die [Milz] kontrolliert das Blut.",extra:["Pfortader","Thymus"]},
 {id:"c_atm",t:7,title:"Atemmechanik",src:"Atmungssystem (Maas)",t2:"Wichtigster Atemmuskel ist das [Zwerchfell], versorgt vom N. [phrenicus]. Die Einatmung ist [aktiv], die Ausatmung in Ruhe [passiv]. Der Totraum beträgt ca. [150] ml.",extra:["vagus","500"]},
 {id:"c_vol",t:7,title:"Lungenvolumina",src:"Atmungssystem (Maas)",t2:"Die [Vitalkapazität] = AZV + IRV + ERV. Die [Totalkapazität] = VK + RV. Der Tiffeneau-Wert ist FEV1/VK und beim Gesunden über [75] %. Bei [obstruktiven] Erkrankungen ist FEV1 vermindert, bei [restriktiven] die Vitalkapazität.",extra:["50","Residualvolumen"]},
 {id:"c_nier",t:8,title:"Harnbildung",src:"Urogenitaltrakt (Maas)",t2:"Im [Glomerulus] werden täglich ca. [180] Liter Primärharn filtriert. [99] % werden rückresorbiert. [ADH] steigert die Wasserresorption, [Aldosteron] die Natriumresorption.",extra:["ANP","18","Renin"]},
 {id:"c_ph",t:8,title:"Säure-Basen-Haushalt",src:"Urogenitaltrakt (Maas)",t2:"Der Blut-pH liegt bei [7,37–7,45]. Unter 7,37 spricht man von [Azidose]. Wichtigstes Puffersystem ist der [Bicarbonat]-Puffer. Die [Lunge] reguliert über CO2, die [Niere] über HCO3−.",extra:["Alkalose","Leber"]},
 {id:"c_frau",t:9,title:"Weiblicher Zyklus",src:"Urogenitaltrakt (Maas)",t2:"Der Eisprung wird durch [LH] ausgelöst. Der Gelbkörper bildet [Progesteron]. Die [Funktionalis] wird mit der Menstruation abgestoßen, die [Basalis] bleibt. Die Befruchtung findet im [Eileiter] statt.",extra:["Östrogen","Uterus"]},
 {id:"c_mann",t:9,title:"Männliche Organe",src:"Urogenitaltrakt (Maas)",t2:"[Leydig]-Zellen bilden Testosteron. Spermien reifen im [Nebenhoden]. Die [Bläschendrüse] liefert 70 % des Spermas mit Fruktose, die [Prostata] ca. 30 % mit PSA. Im Skrotum ist es [2–4] °C kühler.",extra:["Sertoli","Cowper-Drüse"]}
];
